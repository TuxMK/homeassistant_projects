# Waste widget for the overview dashboard
# Shows the next waste collection and links to the waste calendar.
#
# Requirements:
# - Sensor "sensor.nachste_abholung" (adjust the name if needed)
# - Mushroom Cards (install via HACS)

type: custom:mushroom-template-card
primary: Nächste Abholung
secondary: "{{ states('sensor.nachste_abholung') }}"
icon: mdi:delete-empty
color: grey
multiline_secondary: true
tap_action:
  action: navigate
  navigation_path: /lovelace/trash-calendar
grid_options:
  columns: 6
  rows: 2
features_position: bottom
badge_icon: |-
  {% set s = states('sensor.nachste_abholung') | lower %}
            {% if 'bio' in s %}mdi:flower
            {% elif 'papier' in s %}mdi:newspaper
            {% elif 'wertstoff' in s or 'gelb' in s %}mdi:recycle-variant
            {% elif 'rest' in s %}mdi:trash-can-outline
            {% else %}mdi:dump-truck{% endif %}
badge_color: |-
  {% set s = states('sensor.nachste_abholung') | lower %}
            {% if 'bio' in s %}lime
            {% elif 'papier' in s %}blue
            {% elif 'wertstoff' in s or 'gelb' in s %}amber
            {% elif 'rest' in s %}grey
            {% else %}green{% endif %}
