# Pool widget for the overview dashboard
# Shows the pool temperature and pump status and links to the pool view.
#
# Requirements:
# - sensor.pool_pumpe_temperatur, binary_sensor.pool_pumpe_betriebszustand
# - Mushroom Cards (install via HACS)

type: custom:mushroom-template-card
primary: |
  Pool {{ states('sensor.pool_pumpe_temperatur') | round(1) }} °C
secondary: |
  {% if is_state('binary_sensor.pool_pumpe_betriebszustand', 'on') %}Pumpe läuft
  {% else %}Pumpe aus{% endif %}
icon: mdi:pool
icon_color: teal
multiline_secondary: true
tap_action:
  action: navigate
  navigation_path: /lovelace/pool
grid_options:
  columns: 6
  rows: 2
