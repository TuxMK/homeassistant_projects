# Sicherheits-Dashboard mit zentralen Entity-Listen
#
# Nutzt die Attribute von sensor.sicherheitsstatus für dynamische Entity-Listen.
# Die Pattern sind zentral in custom_templates/security_entities.jinja definiert.
#
# Voraussetzungen:
# - Template-Sensor "sensor.sicherheitsstatus"
# - custom:auto-entities (via HACS)
# - custom:mushroom (via HACS)
# - card-mod (via HACS, optional für Farben)

type: sections
max_columns: 4
icon: mdi:shield-home
path: security
title: Sicherheit
sections:
  - type: grid
    cards:
      - type: heading
        heading_style: title
        heading: Alarm-Modus 🚨
      - type: custom:mushroom-alarm-control-panel-card
        entity: alarm_control_panel.alarm_zentrale
        states:
          - armed_home
        grid_options:
          columns: full
          rows: 2
      - type: custom:mushroom-alarm-control-panel-card
        entity: alarm_control_panel.feuer_co_alarm
        states:
          - armed_home
          - armed_custom_bypass
        grid_options:
          columns: full
          rows: 2
      - type: custom:mushroom-alarm-control-panel-card
        entity: alarm_control_panel.leckage_alarm
        states:
          - armed_home
        grid_options:
          columns: full
      - type: heading
        heading_style: title
        grid_options:
          rows: auto
          columns: full
        visibility:
          - condition: screen
            media_query: "(min-width: 768px)"
      - type: heading
        heading_style: title
        heading: Probealarm 🧪
      - type: custom:mushroom-select-card
        entity: input_select.probealarm
        icon_color: orange
        fill_container: false
        layout: default
        primary_info: name
        secondary_info: last-changed
        icon_type: icon
        hold_action:
          action: none
        tap_action:
          action: none
        grid_options:
          columns: 12
          rows: 2
    column_span: 1
  - type: grid
    cards:
      - type: heading
        heading: Alarm-Status 🚨
        heading_style: title
      - type: custom:auto-entities
        card:
          type: entities
        filter:
          template: >
            [

            {% for e in state_attr('sensor.sicherheitsstatus',
            'alarm_entities_co') | default([]) %}
              {% set color = 'green' if states(e)|float(0) < 30 else 'yellow' if states(e)|float(0) < 50 else 'orange' if states(e)|float(0) < 100 else 'red' %}
              {"entity": "{{ e }}", "card_mod": {"style": ":host { --state-icon-color: {{ color }}; }"}}{{ "," if not loop.last else "" }}
            {% endfor %}

            {% if state_attr('sensor.sicherheitsstatus', 'alarm_entities_co') |
            default([]) | length > 0 and state_attr('sensor.sicherheitsstatus',
            'alarm_entities_rauch') | default([]) | length > 0 %}
              ,{"type": "divider"},
            {% endif %}

            {% for e in state_attr('sensor.sicherheitsstatus',
            'alarm_entities_rauch') | default([]) %}
              {% set color = 'green' if is_state(e, 'off') else 'red' %}
              {"entity": "{{ e }}", "card_mod": {"style": ":host { --state-icon-color: {{ color }}; }"}}{{ "," if not loop.last else "" }}
            {% endfor %}

            {% if state_attr('sensor.sicherheitsstatus',
            'alarm_entities_leckage') | default([]) | length > 0 and
            (state_attr('sensor.sicherheitsstatus', 'alarm_entities_rauch') |
            default([]) | length > 0 or state_attr('sensor.sicherheitsstatus',
            'alarm_entities_co') | default([]) | length > 0) %}
                          ,{"type": "divider"},
                        {% endif %}
                        {% for e in state_attr('sensor.sicherheitsstatus', 'alarm_entities_leckage') | default([]) %}
                          {% set color = 'green' if is_state(e, 'off') else 'red' %}
                          {"entity": "{{ e }}", "card_mod": {"style": ":host { --state-icon-color: {{ color }}; }"}}{{ "," if not loop.last else "" }}
                        {% endfor %}
            ]
  - type: grid
    cards:
      - type: heading
        heading_style: title
        heading: Batterie der Sensoren 🔋
      - type: custom:auto-entities
        card:
          type: entities
        filter:
          template: >
            [

            {% for e in state_attr('sensor.sicherheitsstatus',
            'alarm_entities_batterie') | default([]) %}
              {% set color = 'green' if states(e)|float(0) > 50 else 'orange' if states(e)|float(0) > 25 else 'red' %}
              {"entity": "{{ e }}", "card_mod": {"style": ":host { --state-icon-color: {{ color }}; }"}}{{ "," if not loop.last else "" }}
            {% endfor %}

            ]
  - type: grid
    cards:
      - type: heading
        heading: Fehler-Zustände der Sensoren 🔴
        heading_style: title
      - type: custom:auto-entities
        card:
          type: entities
        filter:
          template: >
            [

            {% for e in state_attr('sensor.sicherheitsstatus',
            'alarm_entities_fehler') | default([]) %}
              {% set color = 'grey' if states(e) in ['unknown', 'unavailable', 'none'] else 'green' if is_state(e, 'off') else 'red' %}
              {"entity": "{{ e }}", "card_mod": {"style": ":host { --state-icon-color: {{ color }}; }"}}{{ "," if not loop.last else "" }}
            {% endfor %}

            ]
  - type: grid
    cards: []
cards: []
header:
  card:
    type: markdown
    text_only: true
    content: <h1>🛡️ Hausüberwachung</h1>
badges:
  - type: custom:mushroom-template-badge
    icon: |
      {% if is_state('sensor.sicherheitsstatus', 'Alarm') %}
        mdi:shield-alert
      {% elif is_state('sensor.sicherheitsstatus', 'Warnung') %}
        mdi:shield-half-full
      {% else %}
        mdi:shield-check
      {% endif %}
    color: |
      {% if is_state('sensor.sicherheitsstatus', 'Alarm') %}
        red
      {% elif is_state('sensor.sicherheitsstatus', 'Warnung') %}
        orange
      {% else %}
        green
      {% endif %}
    content: >
      {% set status = states('sensor.sicherheitsstatus') %} {% if status ==
      'Alarm' %}
        Sicherheitsalarm
      {% elif status == 'Warnung' %}
        Sicherheitswarnung
      {% else %}
        Alles sicher
      {% endif %}
    tap_action:
      action: navigate
      navigation_path: /lovelace/security
