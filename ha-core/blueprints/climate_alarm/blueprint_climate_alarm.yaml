# ============================================================
# AUTOMATION SETTINGS
# ============================================================
mode: queued
max: 10
max_exceeded: silent

# ============================================================
# VARIABLES
# ============================================================
variables:
  # Sensor settings
  temperature_sensors: !input temperature_sensors
  humidity_sensors: !input humidity_sensors
  temp_min: !input temp_min
  temp_max: !input temp_max
  hum_min: !input hum_min
  hum_max: !input hum_max
  temp_hysteresis: !input temp_hysteresis
  hum_hysteresis: !input hum_hysteresis
  alarm_active_helper: !input alarm_active_helper
  silence_button_title: !input silence_button_title

  # Hysteresis-adjusted thresholds for all-clear
  temp_clear_min: "{{ (temp_min | float) + (temp_hysteresis | float) }}"
  temp_clear_max: "{{ (temp_max | float) - (temp_hysteresis | float) }}"
  hum_clear_min: "{{ (hum_min | float) + (hum_hysteresis | float) }}"
  hum_clear_max: "{{ (hum_max | float) - (hum_hysteresis | float) }}"

  # Trigger context
  trigger_entity: "{{ trigger.entity_id }}"
  trigger_value: "{{ trigger.to_state.state | float(0) }}"
  trigger_sensor_name: "{{ state_attr(trigger.entity_id, 'friendly_name') | default(trigger.entity_id) }}"

  # Previous state (for transition detection)
  from_state_value: "{{ trigger.from_state.state | float(none) }}"

  # Temperature transition detection
  from_temp_not_in_alarm: >-
    {{ from_state_value is none or
       (from_state_value <= (temp_max | float) and from_state_value >= (temp_min | float)) }}
  from_temp_not_in_clear: >-
    {{ from_state_value is not none and
       (from_state_value > (temp_clear_max | float) or
        from_state_value < (temp_clear_min | float)) }}

  # Humidity transition detection
  from_hum_not_in_alarm: >-
    {{ from_state_value is none or
       (from_state_value <= (hum_max | float) and from_state_value >= (hum_min | float)) }}
  from_hum_not_in_clear: >-
    {{ from_state_value is not none and
       (from_state_value > (hum_clear_max | float) or
        from_state_value < (hum_clear_min | float)) }}

  # Live alarm status checks (replace input_boolean state lookups)
  any_temp_in_alarm: >-
    {% set ns = namespace(found=false) %}
    {% for sid in temperature_sensors %}
      {% set val = states(sid) | float(none) %}
      {% if val is not none and (val > (temp_max | float) or val < (temp_min | float)) %}
        {% set ns.found = true %}
      {% endif %}
    {% endfor %}
    {{ ns.found }}
  any_hum_in_alarm: >-
    {% set ns = namespace(found=false) %}
    {% for sid in humidity_sensors %}
      {% set val = states(sid) | float(none) %}
      {% if val is not none and (val > (hum_max | float) or val < (hum_min | float)) %}
        {% set ns.found = true %}
      {% endif %}
    {% endfor %}
    {{ ns.found }}

  # All sensors alarm list (for notifications)
  all_temp_alarm_sensors: >-
    {% set ns = namespace(sensors=[]) %}
    {% for sid in temperature_sensors %}
      {% set val = states(sid) | float(none) %}
      {% if val is not none and (val > (temp_max | float) or val < (temp_min | float)) %}
        {% set name = state_attr(sid, 'friendly_name') | default(sid) %}
        {% set area = area_name(sid) %}
        {% set area_text = ' (' ~ area ~ ')' if area is not none else '' %}
        {% set ns.sensors = ns.sensors + [name ~ area_text ~ ': ' ~ val ~ ' °C'] %}
      {% endif %}
    {% endfor %}
    {{ ns.sensors | join('\n') }}

  all_hum_alarm_sensors: >-
    {% set ns = namespace(sensors=[]) %}
    {% for sid in humidity_sensors %}
      {% set val = states(sid) | float(none) %}
      {% if val is not none and (val > (hum_max | float) or val < (hum_min | float)) %}
        {% set name = state_attr(sid, 'friendly_name') | default(sid) %}
        {% set area = area_name(sid) %}
        {% set area_text = ' (' ~ area ~ ')' if area is not none else '' %}
        {% set ns.sensors = ns.sensors + [name ~ area_text ~ ': ' ~ val ~ ' %'] %}
      {% endif %}
    {% endfor %}
    {{ ns.sensors | join('\n') }}

  # All-clear checks
  all_temp_in_range: >-
    {% set ns = namespace(all_ok=true) %}
    {% for sid in temperature_sensors %}
      {% set val = states(sid) | float(none) %}
      {% if val is none or val > (temp_clear_max | float) or val < (temp_clear_min | float) %}
        {% set ns.all_ok = false %}
      {% endif %}
    {% endfor %}
    {{ ns.all_ok }}

  all_hum_in_range: >-
    {% set ns = namespace(all_ok=true) %}
    {% for sid in humidity_sensors %}
      {% set val = states(sid) | float(none) %}
      {% if val is none or val > (hum_clear_max | float) or val < (hum_clear_min | float) %}
        {% set ns.all_ok = false %}
      {% endif %}
    {% endfor %}
    {{ ns.all_ok }}

  # Temp alarm notification inputs
  temp_alarm_include_device_notify: !input temp_alarm_include_device_notify
  temp_alarm_notify_device: !input temp_alarm_notify_device
  temp_alarm_notify_entities: !input temp_alarm_notify_entities
  temp_alarm_include_notify_all: !input temp_alarm_include_notify_all
  temp_alarm_html5_notify_entities: !input temp_alarm_html5_notify_entities
  temp_alarm_notify_title: !input temp_alarm_notify_title
  temp_alarm_notify_message: !input temp_alarm_notify_message
  temp_alarm_notify_tag: !input temp_alarm_notify_tag
  temp_alarm_notify_interruption_level: !input temp_alarm_notify_interruption_level
  temp_alarm_notify_sound: !input temp_alarm_notify_sound
  temp_alarm_notify_data: !input temp_alarm_notify_data
  temp_alarm_notify_channel: !input temp_alarm_notify_channel
  temp_alarm_notify_icon: !input temp_alarm_notify_icon
  temp_alarm_notify_icon_colour: !input temp_alarm_notify_icon_colour
  temp_alarm_include_ui_notify: !input temp_alarm_include_ui_notify
  temp_alarm_ui_notify_title: !input temp_alarm_ui_notify_title
  temp_alarm_ui_notify_message: !input temp_alarm_ui_notify_message
  temp_alarm_ui_notify_id: !input temp_alarm_ui_notify_id
  temp_alarm_include_dashboard_notify: !input temp_alarm_include_dashboard_notify
  temp_alarm_dashboard_text_helper: !input temp_alarm_dashboard_text_helper
  temp_alarm_include_todo: !input temp_alarm_include_todo
  temp_alarm_todo_list: !input temp_alarm_todo_list
  temp_alarm_todo_title: !input temp_alarm_todo_title
  temp_alarm_notify_action_buttons: !input temp_alarm_notify_action_buttons
  temp_alarm_action_button_todo: !input temp_alarm_action_button_todo
