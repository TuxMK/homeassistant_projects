    {% set push = namespace(data={}) %}
    {% if temp_alarm_notify_interruption_level in ['active', 'critical', 'time-sensitive', 'passive'] %}
      {% set push.data = dict(push.data, **{ 'interruption-level': temp_alarm_notify_interruption_level }) %}
    {% endif %}
    {% if temp_alarm_notify_sound != [] %}
      {% set push.data = dict(push.data, **{ 'sound': temp_alarm_notify_sound }) %}
    {% endif %}
    {% if push.data %}
      {% set message.data = dict(message.data, **{ 'push': push.data }) %}
    {% endif %}
    {% if 'high_priority' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'ttl': 0, 'priority': 'high' }) %}
    {% endif %}
    {% if 'channel' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'channel': temp_alarm_notify_channel }) %}
    {% endif %}
    {% if 'sticky' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'sticky': "true" }) %}
    {% endif %}
    {% if 'icon' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'notification_icon': temp_alarm_notify_icon }) %}
