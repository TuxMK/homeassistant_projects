                                        data:
                                          title: "{{ hum_alarm_notify_title }}"
                                          message: "{{ hum_alarm_notify_message }}"
                                          data: "{{ hum_alarm_device_message_data_action_button }}"
                                        continue_on_error: true
                    # -- UI Notification --
