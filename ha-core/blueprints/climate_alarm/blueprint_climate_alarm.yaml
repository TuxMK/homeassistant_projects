blueprint:
  name: Climate Alarm - Temperature & Humidity Monitoring
  description: >
    # Climate Alarm - Temperature & Humidity Monitoring

    **Version: 1.1**


    Real-time monitoring of temperature and humidity sensors with configurable normal ranges, hysteresis, and priority logic.


    <details>
    <summary><b>The Automation Process:</b></summary>

      - **Real-Time Triggers:**
        - Reacts immediately to state changes of the selected sensors.
        - An alarm is triggered as soon as a sensor value leaves the normal range.
        - An all-clear notification is sent once all sensors are back within the normal range.

      - **Sensor Selection:**
        - Select one or more temperature sensors.
        - Select one or more humidity sensors.
        - Define a normal range (min/max) for each type.

      - **Hysteresis:**
        - Separate configurable hysteresis values for temperature and humidity prevent alarm flickering at threshold boundaries.
        - Example: Alarm at >26 °C, all-clear only at <25 °C (1 °C hysteresis).

      - **Priority:**
        - Temperature alarms take priority over humidity alarms.
        - When both temperature and humidity alarms occur simultaneously, only temperature actions are executed.
        - Humidity alarms are deferred and processed once the temperature alarm ends.

      - **Notification Options:**
        - Separate actions for temperature and humidity alarms.
        - Push notifications (iOS/Android).
        - UI notifications.
        - Dashboard notifications via text helper.
        - To-Do list integration with action buttons.
        - Custom actions.

    </details>


    Required = *
  domain: automation
  input:
    sensor_settings:
      name: "Sensor Settings *"
      icon: mdi:thermometer-alert
      description: >
        Configure sensors, normal ranges, and hysteresis.
      collapsed: true
      input:
        temperature_sensors:
          name: Temperature Sensors (Optional)
          description: >
            Select the temperature sensors you would like to monitor.
            All selected sensors share the same normal range.
            For different ranges (e.g., refrigerator vs. living room), create separate automations.
          default: []
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
              multiple: true
        humidity_sensors:
          name: Humidity Sensors (Optional)
          description: >
            Select the humidity sensors you would like to monitor.
            All selected sensors share the same normal range.
          default: []
          selector:
            entity:
              filter:
                domain: sensor
                device_class: humidity
              multiple: true
        temp_min:
          name: "Temperature Lower Limit *"
          description: >
            Minimum temperature in degrees Celsius. An alarm is triggered when a sensor falls below this value.
          default: 18
          selector:
            number:
              min: -40
              max: 80
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        temp_max:
          name: "Temperature Upper Limit *"
          description: >
            Maximum temperature in degrees Celsius. An alarm is triggered when a sensor exceeds this value.
          default: 26
          selector:
            number:
              min: -40
              max: 80
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        hum_min:
          name: "Humidity Lower Limit *"
          description: >
            Minimum relative humidity in percent.
          default: 30
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: box
        hum_max:
          name: "Humidity Upper Limit *"
          description: >
            Maximum relative humidity in percent.
          default: 70
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: box
        temp_hysteresis:
          name: Temperature Hysteresis
          description: >
            Hysteresis value for temperature sensors to prevent alarm flickering at threshold boundaries.
            This value is subtracted from the upper limit or added to the lower limit for the all-clear threshold.


            **Example:** Upper limit 26 °C with hysteresis 1 -> Alarm at >26 °C, all-clear at <25 °C.


            Set to 0 to disable hysteresis.
          default: 1.0
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
              unit_of_measurement: "°C"
              mode: box
        hum_hysteresis:
          name: Humidity Hysteresis
          description: >
            Hysteresis value for humidity sensors to prevent alarm flickering at threshold boundaries.
            This value is subtracted from the upper limit or added to the lower limit for the all-clear threshold.


            **Example:** Upper limit 70 % with hysteresis 3 -> Alarm at >70 %, all-clear at <67 %.


            Set to 0 to disable hysteresis.
          default: 3.0
          selector:
            number:
              min: 0
              max: 20
              step: 0.5
              unit_of_measurement: "%"
              mode: box
        alarm_active_helper:
          name: "Acoustic Alarm Helper (Optional)"
          description: >
            Optional input boolean helper for acoustic alarm control.
            This helper is turned ON when an alarm triggers.
            Create your own automation that watches this helper to trigger
            your acoustic alarm system (e.g., webhook, siren).


            The alarm notification includes a 'Silence Alarm' button to turn it OFF.
            Automatically turned OFF when all sensors return to normal range.
          default: []
          selector:
            entity:
              filter:
                domain: input_boolean
        silence_button_title:
          name: "Silence Button Title"
          description: >
            Title for the 'Silence Alarm' action button in push notifications.
            Only shown when an Acoustic Alarm Helper is configured above.
          default: "Silence Alarm"
          selector:
            text:

    # ============================================================
    # TEMPERATURE ALARM NOTIFICATIONS
    # ============================================================
    temp_alarm_notify:
      name: "Temperature Alarm - Notifications & Actions"
      icon: mdi:thermometer-high
      description: >
        Actions to execute when a temperature sensor leaves the normal range.
      collapsed: true
      input:
        # -- Device Notification --
        temp_alarm_include_device_notify:
          name: Use The Easy Notify - Device Notification Options (Optional)
          description: >
            Enabling this option will send push notifications to the selected devices below when a temperature alarm is triggered.
          default: disabled
          selector:
            select:
              options:
                - label: Enable Device Notification
                  value: "enabled"
                - label: Disable Device Notification
                  value: "disabled"
        temp_alarm_notify_device:
          name: Devices Notified (Optional)
          description: >
            If you've enabled device notifications above, please select the devices to receive the notifications.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true
        temp_alarm_notify_entities:
          name: Notify Entities (Optional)
          description: >
            Additional notify entities for push notifications (e.g., notify groups, individual notify entities).
            Works alongside device selection above. Select any entity from the notify domain.
          default: []
          selector:
            entity:
              filter:
                - domain: notify
              multiple: true
        temp_alarm_include_notify_all:
          name: Send to All Devices - notify.notify (Optional)
          description: >
            Send push notifications to ALL registered devices using the notify.notify service.
            Uses the same title, message and notification settings as device notifications above.
          default: disabled
          selector:
            select:
              options:
                - label: Enable
                  value: "enabled"
                - label: Disable
                  value: "disabled"
        temp_alarm_html5_notify_entities:
          name: HTML5 Browser Push (Optional)
          description: >
            Select HTML5 notify entities for browser push notifications. Leave empty to disable HTML5 push.
            Replaces the deprecated notify.html5 action - uses notify.send_message on each selected entity.
            Uses the same title, message and notification settings as device notifications above.
          default: []
          selector:
            entity:
              filter:
                - integration: html5
              multiple: true
        temp_alarm_notify_title:
          name: Title
          description: >
            Enter in the notification title of your message.
          default: Temperature Alert!
          selector:
            text:
        temp_alarm_notify_message:
          name: Message
          description: >
            Enter in the notification message. Available variables:

            - `{{trigger_sensor_name}}` - Sensor name

            - `{{trigger_value}}` - Current reading

            - `{{temp_min}}` / `{{temp_max}}` - Threshold values

            - `{{all_temp_alarm_sensors}}` - All sensors currently in alarm
          default: "Temperature Alert! {{trigger_sensor_name}}: {{trigger_value}} °C is outside the normal range ({{temp_min}} - {{temp_max}} °C)"
          selector:
            text:
              multiline: true
        temp_alarm_notify_tag:
          name: Device Notification Tag
          description: >
            You can use a tag to keep your notifications organized.
            When a new notification with the same tag is sent, it replaces the old one, so you won't get cluttered with duplicates.


            If this input is left blank, no tag will be applied and each notification will be treated as separate.
          default: []
          selector:
            text:
        temp_alarm_notify_interruption_level:
          name: Interruption Level - iOS Only
          description: >
            On devices running iOS 15 and later, you can configure the interruption level for your notifications to ensure they are delivered according to your preferences.
            Choose the desired interruption level from the dropdown list.
          default: active
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: "active"
                - label: Critical Notifications
                  value: "critical"
                - label: Time Sensitive Notifications
                  value: "time-sensitive"
                - label: Quiet Notifications Without Waking Screen
                  value: "passive"
        temp_alarm_notify_sound:
          name: Notification Sound - iOS Only
          description: >
            Enter the filename of the notification sound, including the file extension.
          default: []
          selector:
            text:
        temp_alarm_notify_data:
          name: Android Only Options (Optional)
          description: >
            **High Priority** notifications ensure that you receive important alerts immediately.
            These notifications bypass normal delivery delays and are delivered instantly to your device.


            **Sticky Notification** ensures that important alerts are not dismissed when selected. They remain on your notification screen until you actively clear or swipe them away.


            **Notification Channel** allows you to easily organize different notification settings,
            including notification sounds, vibrations, and other device-specific features.
            If you choose this option, please enter your desired channel name below.


            **Icon** allows you to replace the default Home Assistant icon with one of your choice.
            If selected, choose your preferred icon using the **Icon - Android Only** option below, and set the icon colour using **Icon Colour - Android Only**.
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: High Priority
                  value: "high_priority"
                - label: Sticky Notification
                  value: "sticky"
                - label: Notification Channel
                  value: "channel"
                - label: Icon
                  value: "icon"
        temp_alarm_notify_channel:
          name: Notification Channel - Android Only
          description: >
            If you have chosen to use a notification channel, simply enter the name of an existing channel or create a new one by entering a name here.
          default: []
          selector:
            text:
        temp_alarm_notify_icon:
          name: Icon - Android Only
          description: >
            Select a custom icon to replace the default Home Assistant icon in the notification.
            This setting applies only if the **Icon** option is selected in **Android Only Options** above.
          default: "mdi:thermometer-alert"
          selector:
            icon:
        temp_alarm_notify_icon_colour:
          name: Icon Colour - Android Only
          description: >
            Choose a colour for your custom notification icon.
            This setting applies only if the **Icon** option is selected in **Android Only Options** above.
          default: [244, 67, 54]
          selector:
            color_rgb:
        # -- UI Notification --
        temp_alarm_include_ui_notify:
          name: Use The Easy Notify - UI Notification Options (Optional)
          description: >
            Enabling this option will display notifications directly within the Home Assistant user interface (UI).
          default: disabled
          selector:
            select:
              options:
                - label: Enable UI Notification
                  value: "enabled"
                - label: Disable UI Notification
                  value: "disabled"
        temp_alarm_ui_notify_title:
          name: Title
          description: >
            Enter in the notification title of your message.
          default: Temperature Alert!
          selector:
            text:
        temp_alarm_ui_notify_message:
          name: Message
          description: >
            Enter in the notification message. The same variables as in the device notification are available.
          default: "Temperature Alert! {{trigger_sensor_name}}: {{trigger_value}} °C is outside the normal range ({{temp_min}} - {{temp_max}} °C)"
          selector:
            text:
              multiline: true
        temp_alarm_ui_notify_id:
          name: Notification ID
          description: >
            You can use a notification ID to keep your notifications organized.
            When a new notification with the same notification ID is sent, it replaces the old one, so you won't get cluttered with duplicates.


            If this input is left blank, no notification ID will be applied and each notification will be treated as separate.
          default: []
          selector:
            text:
        # -- Dashboard Notification --
        temp_alarm_include_dashboard_notify:
          name: Use The Easy Notify - Dashboard Notification Option (Optional)
          description: >
            Display the alarm status on a dashboard via a text helper so everyone can easily see the latest updates at a glance.
          default: disabled
          selector:
            select:
              options:
                - label: Enable Dashboard Notification
                  value: "enabled"
                - label: Disable Dashboard Notification
                  value: "disabled"
        temp_alarm_dashboard_text_helper:
          name: "Dashboard Notification - Text Helper"
          description: >
            Select the **Text Helper** that will store the notification message, which can then be shown on a dashboard.
          default: []
          selector:
            entity:
              filter:
                domain: input_text
        # -- To-Do Integration --
        temp_alarm_include_todo:
          name: Easy Notify - To-Do List (Optional)
          description: >
            Enabling this option will add the alarm directly to a To-Do list.
          default: disabled
          selector:
            select:
              options:
                - label: Enable To-Do List
                  value: "enabled"
                - label: Disable To-Do List
                  value: "disabled"
        temp_alarm_todo_list:
          name: Easy Notify Action Buttons - To-Do List Selection
          description: >
            Choose the To-Do list where you'd like to add your task.


            ***Note** - The default Shopping List is not compatible because it doesn't support task descriptions.*
            All other To-Do lists are fully supported.
          default: []
          selector:
            entity:
              filter:
                domain: todo
        temp_alarm_todo_title:
          name: Easy Notify Action Buttons - Task Title
          description: >
            When the alarm is triggered, a new task will be added to your selected To-Do list.
            Enter the title you'd like to use for the To-Do task.
          default: "Check temperature alarm"
          selector:
            text:
        # -- Action Buttons --
        temp_alarm_notify_action_buttons:
          name: Easy Notify - Action Buttons (Optional)
          description: >
            Add interactive buttons to your **device notifications**, allowing you to send items from a temperature alert directly to one of your To-Do lists.


            ***Note** - If you select **Add To-Do List Action Buttons + Clear on Action**, make sure to set the **Device Notification Tag** in the notification options above for this option to work properly.*
          default: disabled
          selector:
            select:
              options:
                - label: Add To-Do List Action Buttons
                  value: "enable_todo_button"
                - label: Add To-Do List Action Buttons + Confirmation Message
                  value: "enable_todo_button_confirmation"
                - label: Add To-Do List Action Buttons + Clear on Action
                  value: "enable_todo_button_clear"
                - label: Disable Action Buttons
                  value: "disabled"
        temp_alarm_action_button_todo:
          name: Easy Notify Action Buttons - Action Button
          description: >
            Specify the label for the action button that will appear in your notification.
            When pressed, this button will add a task to your selected To-Do list.
          default: "Add To To-Do List!"
          selector:
            text:
        temp_alarm_action_button_cancel:
          name: Easy Notify Action Buttons - Cancel Button
          description: >
            Specify the label for the cancel button that will appear in your notification.
            When pressed, this button cancels the task addition process.
          default: "Cancel"
          selector:
            text:
        temp_alarm_action_button_confirmation_title:
          name: Easy Notify Action Buttons - Action & Cancel Button Confirmation Title
          description: >
            Enter the title for the confirmation notification shown when either the action or cancel button is pressed.
          default: "Temperature Alarm - Confirmation"
          selector:
            text:
        temp_alarm_action_button_confirmation_message:
          name: Easy Notify Action Buttons - Action Button Confirmation Message
          description: >
            Enter the message for the confirmation notification shown when the action button is pressed.
          default: "Temperature alarm has been added to your To-Do list"
          selector:
            text:
        temp_alarm_cancel_button_confirmation_message:
          name: Easy Notify Action Buttons - Cancel Button Confirmation Message
          description: >
            Enter the message for the confirmation notification shown when the cancel button is pressed.
          default: "Cancelled - Nothing was added to your To-Do list"
          selector:
            text:
        # -- Custom Actions --
        temp_alarm_include_custom_actions:
          name: Use The Custom Action Options (Optional)
          description: >
            You can add any custom actions you'd like to run when a temperature alarm is triggered.
          default: disabled
          selector:
            select:
              options:
                - label: Enable Custom Actions
                  value: "enabled"
                - label: Disable Custom Actions
                  value: "disabled"
        temp_alarm_custom_actions:
          name: Custom Actions
          description: >
            Add your own custom actions to run when a temperature alarm is triggered. Available variables:

            `{{trigger_sensor_name}}`, `{{trigger_value}}`, `{{trigger_entity}}`,
            `{{temp_min}}`, `{{temp_max}}`, `{{all_temp_alarm_sensors}}`
          default: []
          selector:
            action:

    # ============================================================
    # TEMPERATURE ALL-CLEAR NOTIFICATIONS
    # ============================================================
    temp_clear_notify:
      name: "Temperature All-Clear - Notifications"
      icon: mdi:thermometer-check
      description: >
        Actions to execute when all temperature sensors are back within the normal range.
      collapsed: true
      input:
        temp_clear_include_device_notify:
          name: Use The Easy Notify - Device Notification Options (Optional)
          description: >
            Enabling this option will send push notifications to the selected devices below when all temperature sensors return to normal.
          default: disabled
          selector:
            select:
              options:
                - label: Enable Device Notification
                  value: "enabled"
                - label: Disable Device Notification
                  value: "disabled"
        temp_clear_notify_device:
          name: Devices Notified (Optional)
          description: >
            If you've enabled device notifications above, please select the devices to receive the notifications.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true
        temp_clear_notify_entities:
          name: Notify Entities (Optional)
          description: >
            Additional notify entities for push notifications (e.g., notify groups, individual notify entities).
            Works alongside device selection above. Select any entity from the notify domain.
          default: []
          selector:
            entity:
              filter:
                - domain: notify
              multiple: true
        temp_clear_include_notify_all:
          name: Send to All Devices - notify.notify (Optional)
          description: >
            Send push notifications to ALL registered devices using the notify.notify service.
            Uses the same title, message and notification settings as device notifications above.
          default: disabled
          selector:
            select:
              options:
                - label: Enable
                  value: "enabled"
                - label: Disable
                  value: "disabled"
        temp_clear_html5_notify_entities:
          name: HTML5 Browser Push (Optional)
          description: >
            Select HTML5 notify entities for browser push notifications. Leave empty to disable HTML5 push.
            Replaces the deprecated notify.html5 action - uses notify.send_message on each selected entity.
            Uses the same title, message and notification settings as device notifications above.
          default: []
          selector:
            entity:
              filter:
                - integration: html5
              multiple: true
        temp_clear_notify_title:
          name: Title
          description: >
            Enter in the notification title of your message.
          default: "Temperature All-Clear"
          selector:
            text:
        temp_clear_notify_message:
          name: Message
          description: >
            Enter in the notification message for the all-clear notification.
          default: "All temperature sensors are back within normal range ({{temp_min}} - {{temp_max}} °C)"
          selector:
            text:
              multiline: true
        temp_clear_notify_tag:
          name: Device Notification Tag
          description: >
            You can use a tag to keep your notifications organized.
            When a new notification with the same tag is sent, it replaces the old one, so you won't get cluttered with duplicates.


            If this input is left blank, no tag will be applied and each notification will be treated as separate.
          default: []
          selector:
            text:
        temp_clear_notify_interruption_level:
          name: Interruption Level - iOS Only
          description: >
            On devices running iOS 15 and later, you can configure the interruption level for your notifications to ensure they are delivered according to your preferences.
            Choose the desired interruption level from the dropdown list.
          default: active
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: "active"
                - label: Critical Notifications
                  value: "critical"
                - label: Time Sensitive Notifications
                  value: "time-sensitive"
                - label: Quiet Notifications Without Waking Screen
                  value: "passive"
        temp_clear_notify_sound:
          name: Notification Sound - iOS Only
          description: >
            Enter the filename of the notification sound, including the file extension.
          default: []
          selector:
            text:
        temp_clear_notify_data:
          name: Android Only Options (Optional)
          description: >
            **High Priority** notifications ensure that you receive important alerts immediately.
            These notifications bypass normal delivery delays and are delivered instantly to your device.


            **Sticky Notification** ensures that important alerts are not dismissed when selected. They remain on your notification screen until you actively clear or swipe them away.


            **Notification Channel** allows you to easily organize different notification settings,
            including notification sounds, vibrations, and other device-specific features.
            If you choose this option, please enter your desired channel name below.


            **Icon** allows you to replace the default Home Assistant icon with one of your choice.
            If selected, choose your preferred icon using the **Icon - Android Only** option below, and set the icon colour using **Icon Colour - Android Only**.
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: High Priority
                  value: "high_priority"
                - label: Sticky Notification
                  value: "sticky"
                - label: Notification Channel
                  value: "channel"
                - label: Icon
                  value: "icon"
        temp_clear_notify_channel:
          name: Notification Channel - Android Only
          description: >
            If you have chosen to use a notification channel, simply enter the name of an existing channel or create a new one by entering a name here.
          default: []
          selector:
            text:
        temp_clear_notify_icon:
          name: Icon - Android Only
          description: >
            Select a custom icon to replace the default Home Assistant icon in the notification.
            This setting applies only if the **Icon** option is selected in **Android Only Options** above.
          default: "mdi:thermometer-check"
          selector:
            icon:
        temp_clear_notify_icon_colour:
          name: Icon Colour - Android Only
          description: >
            Choose a colour for your custom notification icon.
            This setting applies only if the **Icon** option is selected in **Android Only Options** above.
          default: [76, 175, 80]
          selector:
            color_rgb:
        # -- UI Notification --
        temp_clear_include_ui_notify:
          name: Use The Easy Notify - UI Notification Options (Optional)
          description: >
            Enabling this option will display an all-clear notification directly within the Home Assistant user interface (UI).
          default: disabled
          selector:
            select:
              options:
                - label: Enable UI Notification
                  value: "enabled"
                - label: Disable UI Notification
                  value: "disabled"
        temp_clear_ui_notify_title:
          name: Title
          description: >
            Enter in the notification title of your message.
          default: "Temperature All-Clear"
          selector:
            text:
        temp_clear_ui_notify_message:
          name: Message
          description: >
            Enter in the notification message for the all-clear notification.
          default: "All temperature sensors are back within normal range ({{temp_min}} - {{temp_max}} °C)"
          selector:
            text:
              multiline: true
        temp_clear_ui_notify_id:
          name: Notification ID
          description: >
            You can use a notification ID to keep your notifications organized.
            When a new notification with the same notification ID is sent, it replaces the old one, so you won't get cluttered with duplicates.


            If this input is left blank, no notification ID will be applied and each notification will be treated as separate.
          default: []
          selector:
            text:
        # -- Dashboard Notification --
        temp_clear_include_dashboard_notify:
          name: Use The Easy Notify - Dashboard Notification Option (Optional)
          description: >
            Display the all-clear status on a dashboard via a text helper.
          default: disabled
          selector:
            select:
              options:
                - label: Enable Dashboard Notification
                  value: "enabled"
                - label: Disable Dashboard Notification
                  value: "disabled"
        temp_clear_dashboard_text_helper:
          name: "Dashboard Notification - Text Helper"
          description: >
            Select the **Text Helper** that will store the notification message, which can then be shown on a dashboard.
          default: []
          selector:
            entity:
              filter:
                domain: input_text
        # -- Custom Actions --
        temp_clear_include_custom_actions:
          name: Use The Custom Action Options (Optional)
          description: >
            You can add any custom actions you'd like to run when the temperature all-clear is triggered.
          default: disabled
          selector:
            select:
              options:
                - label: Enable Custom Actions
                  value: "enabled"
                - label: Disable Custom Actions
                  value: "disabled"
        temp_clear_custom_actions:
          name: Custom Actions
          description: >
            Add your own custom actions to run when the temperature all-clear is triggered.
          default: []
          selector:
            action:

    # ============================================================
    # HUMIDITY ALARM NOTIFICATIONS
    # ============================================================
    hum_alarm_notify:
      name: "Humidity Alarm - Notifications & Actions"
      icon: mdi:water-alert
      description: >
        Actions to execute when a humidity sensor leaves the normal range.
        These actions are suppressed while a temperature alarm is active.
      collapsed: true
      input:
        hum_alarm_include_device_notify:
          name: Use The Easy Notify - Device Notification Options (Optional)
          description: >
            Enabling this option will send push notifications to the selected devices below when a humidity alarm is triggered.
          default: disabled
          selector:
            select:
              options:
                - label: Enable Device Notification
                  value: "enabled"
                - label: Disable Device Notification
                  value: "disabled"
        hum_alarm_notify_device:
          name: Devices Notified (Optional)
          description: >
            If you've enabled device notifications above, please select the devices to receive the notifications.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true
        hum_alarm_notify_entities:
          name: Notify Entities (Optional)
          description: >
            Additional notify entities for push notifications (e.g., notify groups, individual notify entities).
            Works alongside device selection above. Select any entity from the notify domain.
          default: []
          selector:
            entity:
