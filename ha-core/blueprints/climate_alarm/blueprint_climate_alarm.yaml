                                                sequence:
                                                  - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                    data:
                                                      title: "{{ hum_alarm_action_button_confirmation_title }}"
                                                      message: "{{ hum_alarm_action_button_confirmation_message }}"
                                                      data: "{{ hum_alarm_device_message_data }}"
                                                    continue_on_error: true
                                        - conditions:
                                            - "{{ hum_alarm_notify_action_buttons == 'enable_todo_button_clear' }}"
                                          sequence:
                                            - repeat:
                                                for_each: !input hum_alarm_notify_device
                                                sequence:
                                                  - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                    data:
                                                      message: clear_notification
                                                      data:
                                                        tag: "{{ hum_alarm_notify_tag }}"
                                                    continue_on_error: true
                                  - conditions: "{{ wait.trigger.event.data.action == hum_alarm_action_button_cancel }}"
                                    sequence:
                                      - choose:
                                        - conditions:
                                            - "{{ hum_alarm_notify_action_buttons == 'enable_todo_button_confirmation' }}"
                                          sequence:
                                            - repeat:
                                                for_each: !input hum_alarm_notify_device
                                                sequence:
                                                  - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                    data:
                                                      title: "{{ hum_alarm_action_button_confirmation_title }}"
                                                      message: "{{ hum_alarm_cancel_button_confirmation_message }}"
                                                      data: "{{ hum_alarm_device_message_data }}"
                                                    continue_on_error: true
                                        - conditions:
                                            - "{{ hum_alarm_notify_action_buttons == 'enable_todo_button_clear' }}"
                                          sequence:
                                            - repeat:
                                                for_each: !input hum_alarm_notify_device
                                                sequence:
                                                  - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                    data:
                                                      message: clear_notification
                                                      data:
                                                        tag: "{{ hum_alarm_notify_tag }}"
                                                    continue_on_error: true
                                  - conditions: "{{ wait.trigger.event.data.action == 'SILENCE_ALARM' }}"
                                    sequence:
                                      - action: input_boolean.turn_off
                                        target:
                                          entity_id: !input alarm_active_helper

          # -- FEUCHTIGKEITS-ENTWARNUNG: Alle Sensoren wieder im Bereich --
          - alias: "Feuchtigkeit wieder im Normbereich - Entwarnung"
            conditions:
              - condition: template
                value_template: >-
                  {{ (trigger_value | float <= hum_clear_max | float) and
                     (trigger_value | float >= hum_clear_min | float) }}
              - condition: template
                value_template: "{{ from_hum_not_in_clear }}"
              - condition: template
                value_template: "{{ all_hum_in_range }}"
            sequence:
              # Only send clear notifications if no temp alarm is active
              - choose:
                - alias: "Kein Temperaturalarm aktiv - Entwarnung senden"
                  conditions:
                    - condition: template
                      value_template: "{{ not any_temp_in_alarm }}"
                  sequence:
                    # -- Custom Actions --
                    - choose:
                      - conditions:
                          - "{{ hum_clear_include_custom_actions == 'enabled' }}"
                        sequence: !input hum_clear_custom_actions
                    # -- Device Notification --
                    - choose:
                      - alias: "Hum Entwarnung - Geraete-Benachrichtigung"
                        conditions:
                          - "{{ hum_clear_include_device_notify == 'enabled' }}"
                          - "{{ hum_clear_notify_device | length > 0 }}"
                        sequence:
                          - repeat:
                              for_each: !input hum_clear_notify_device
                              sequence:
                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                  data:
                                    title: "{{ hum_clear_notify_title }}"
                                    message: "{{ hum_clear_notify_message }}"
                                    data: "{{ hum_clear_device_message_data }}"
                                  continue_on_error: true
                    # -- Entity Notification --
                    - choose:
                      - alias: "Hum Entwarnung - Entity-Benachrichtigung"
                        conditions:
                          - "{{ hum_clear_include_device_notify == 'enabled' }}"
                          - "{{ hum_clear_notify_entities | length > 0 }}"
                        sequence:
                          - repeat:
                              for_each: !input hum_clear_notify_entities
                              sequence:
                                - action: notify.send_message
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    title: "{{ hum_clear_notify_title }}"
                                    message: "{{ hum_clear_notify_message }}"
                                    data: "{{ hum_clear_device_message_data }}"
                                  continue_on_error: true
                    # -- Notify All Devices --
                    - choose:
                      - alias: "Hum Entwarnung - Alle Geraete (notify.notify)"
                        conditions:
                          - "{{ hum_clear_include_notify_all == 'enabled' }}"
                        sequence:
                          - action: notify.notify
                            data:
                              title: "{{ hum_clear_notify_title }}"
                              message: "{{ hum_clear_notify_message }}"
                              data: "{{ hum_clear_device_message_data }}"
                            continue_on_error: true
                    # -- HTML5 Browser Push --
                    - choose:
                      - alias: "Hum Entwarnung - HTML5 Browser Push"
                        conditions:
                          - "{{ (hum_clear_html5_notify_entities | length > 0) }}"
                        sequence:
                          - repeat:
                              for_each: "{{ hum_clear_html5_notify_entities }}"
                              sequence:
                                - action: notify.send_message
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    title: "{{ hum_clear_notify_title }}"
                                    message: "{{ hum_clear_notify_message }}"
                                    data: "{{ hum_clear_device_message_data }}"
                                  continue_on_error: true
                    # -- UI Notification --
                    - choose:
                      - alias: "Hum Entwarnung - UI-Benachrichtigung"
                        conditions:
                          - "{{ hum_clear_include_ui_notify == 'enabled' }}"
                        sequence:
                          - action: persistent_notification.create
                            data:
                              title: "{{ hum_clear_ui_notify_title }}"
                              message: "{{ hum_clear_ui_notify_message }}"
                              notification_id: "{{ hum_clear_ui_notify_id if hum_clear_ui_notify_id != [] else '' }}"
                    # -- Dashboard Notification --
                    - choose:
                      - alias: "Hum Entwarnung - Dashboard-Benachrichtigung"
                        conditions:
                          - "{{ hum_clear_include_dashboard_notify == 'enabled' }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input hum_clear_dashboard_text_helper
                            data:
                              value: "{{ now().strftime('%d.%m.%Y %H:%M') }} - {{ hum_clear_notify_message[:220] }}"
                    # -- Acoustic Alarm Helper OFF --
                    - choose:
                      - conditions:
                          - "{{ alarm_active_helper not in [[], '', none] }}"
                        sequence:
                          - action: input_boolean.turn_off
                            target:
                              entity_id: !input alarm_active_helper
