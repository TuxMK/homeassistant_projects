blueprint:
  name: Metrics Archive (MariaDB) — maintain monthly partitions
  description: >
    # Maintain monthly partitions

    **Version: 1.0**


    Creates the partitions of the upcoming months in a partitioned archive table in
    good time, and optionally drops the oldest ones. Counterpart to the blueprint
    **Metrics Archive (MariaDB)**, which writes the values.


    A run is **idempotent**: whatever already exists is left alone. If it does not
    run for a few days, the next run catches up.


    <details>
    <summary><b>What a run does</b></summary>

      1. Read the existing partitions from `information_schema.partitions`.
      2. Create the missing months (current month plus lead time) with a single
         `ALTER TABLE … REORGANIZE PARTITION pmax INTO (…)`.
      3. If a retention is set, drop every partition below the threshold with
         `ALTER TABLE … DROP PARTITION`.

      Only months **after** the last existing partition are created — a gap in the
      past can no longer be closed through `pmax`.
    </details>


    <details>
    <summary><b>Requirements</b></summary>

      - The table is already partitioned by `RANGE (TO_DAYS(ts))` and has a catch-all
        partition `pmax` with `VALUES LESS THAN MAXVALUE`. The initial
        `ALTER TABLE … PARTITION BY` rewrites the whole table and therefore stays a
        deliberate manual step — it is in the README.
      - The login used needs **ALTER** (and **DROP** for the retention) on the
        database. The archive's write login deliberately has neither, so a separate
        login in the pyscript app configuration is the way to go.

      If the table is not partitioned or `pmax` is missing, the automation writes a
      warning to the log and changes nothing.
    </details>
  domain: automation
  input:
    ziel:
      name: Target
      icon: mdi:database-cog
      input:
        database:
          name: Database
          description: Name of the database in MariaDB.
          default: ha_metrics
          selector:
            text:
        table:
          name: Table
          description: >
            The partitioned archive table. The partition column is `ts`.
          default: states
          selector:
            text:
        login:
          name: Login
          description: >
            Name of the login from the pyscript app configuration. It needs `ALTER`
            on the database, plus `DROP` for the retention. Leave empty to use the
            `default_login` configured there.
          default: ""
          selector:
            text:

    verhalten:
      name: Behavior
      icon: mdi:calendar-month
      input:
        lead_months:
          name: Lead time
          description: >
            How many months are created ahead. 2 means: besides the current month,
            the next two are always ready. At least 1, so that a change of month
            never runs into a missing partition.
          default: 2
          selector:
            number:
              min: 1
              max: 12
              step: 1
              unit_of_measurement: months
              mode: box
        keep_months:
          name: Retention
          description: >
            How many months are kept. Older partitions are **deleted** — the data in
            them is gone for good. 0 means: delete nothing, the archive grows
            without limit.
          default: 0
          selector:
            number:
              min: 0
              max: 240
              step: 1
              unit_of_measurement: months
              mode: box
        run_at:
          name: Time of day
          description: >
            When the daily run happens. Pick a quiet time, rebuilding the partitions
            locks the table briefly.
          default: "04:17:00"
          selector:
            time:

    verbindung:
      name: Connection (advanced)
      icon: mdi:lan-connect
      collapsed: true
      input:
        host:
          name: Host
          description: Database host. Inside Home Assistant `core-mariadb`.
          default: core-mariadb
          selector:
            text:
        port:
          name: Port
          default: 3306
          selector:
            number:
              min: 1
              max: 65535
              mode: box

mode: single
max_exceeded: silent

triggers:
  - trigger: time
    at: !input run_at
  - trigger: homeassistant
    event: start

variables:
  database: !input database
  table: !input table
  login: !input login
  host: !input host
  port: !input port
  lead: !input lead_months
  keep: !input keep_months

  # Strip backticks from the table name so it can safely go into the SQL
  table_name: "{{ table | replace('`', '') }}"

  # Target months: current month plus lead time, each with its upper bound
  # (= the first day of the following month)
  target_months: >-
    {%- set ns = namespace(l=[]) -%}
    {%- set base = now().year * 12 + now().month - 1 -%}
    {%- for i in range(0, lead + 1) -%}
      {%- set a = base + i -%}
      {%- set b = a + 1 -%}
      {%- set ns.l = ns.l + [{
            'name':  'p%04d_%02d' | format(a // 12, a % 12 + 1),
            'bound': '%04d-%02d-01' | format(b // 12, b % 12 + 1) }] -%}
    {%- endfor -%}
    {{ ns.l }}

actions:
  # Read the existing partitions. For a table that is not partitioned,
  # information_schema returns exactly one row with partition_name = NULL.
  - action: pyscript.sql_execute
    data:
      login: !input login
      database: !input database
      host: !input host
      port: !input port
      query: >-
        SELECT partition_name AS name
        FROM information_schema.partitions
        WHERE table_schema = %s AND table_name = %s
        ORDER BY partition_ordinal_position
      params:
        - "{{ database }}"
        - "{{ table_name }}"
    response_variable: partitions

  - condition: template
    value_template: "{{ partitions.ok | default(false) }}"

  - variables:
      names: >-
        {{ partitions.rows | default([], true) | map(attribute='name')
           | reject('none') | list }}

  # Without partitioning, or without a catch-all partition, nothing is changed
  - if:
      - condition: template
        value_template: "{{ names | count == 0 or 'pmax' not in names }}"
    then:
      - action: system_log.write
        data:
          level: warning
          logger: archiv_partitions
          message: >-
            Table `{{ table_name }}` in `{{ database }}` is not partitioned by ts or
            has no catch-all partition pmax — nothing was changed. The initial
            partitioning is described in the README.
      - stop: "Table not partitioned"

  # Missing months: only those after the last existing partition, because through
  # pmax something can be added at the upper end only
  - variables:
      existing: "{{ names | reject('eq', 'pmax') | list }}"
  - variables:
      last: "{{ (existing | sort | last) if existing | count > 0 else '' }}"
  - variables:
      missing: >-
        {{ target_months | rejectattr('name', 'in', existing)
                         | selectattr('name', 'gt', last) | list }}

  - if:
      - condition: template
        value_template: "{{ missing | count > 0 }}"
    then:
      - action: pyscript.sql_execute
        data:
          login: !input login
          database: !input database
          host: !input host
          port: !input port
          query: >-
            ALTER TABLE `{{ table_name }}` REORGANIZE PARTITION pmax INTO (
            {%- set ns = namespace(t=[]) -%}
            {%- for m in missing -%}
              {%- set ns.t = ns.t + ["PARTITION " ~ m.name ~
                    " VALUES LESS THAN (TO_DAYS('" ~ m.bound ~ "'))"] -%}
            {%- endfor -%}
            {{ (ns.t + ['PARTITION pmax VALUES LESS THAN MAXVALUE']) | join(', ') }})
        response_variable: created

      - condition: template
        value_template: "{{ created.ok | default(false) }}"

  # Retention: drop everything below the threshold
  - condition: template
    value_template: "{{ keep | int(0) > 0 }}"

  - variables:
      threshold: >-
        {%- set a = now().year * 12 + now().month - 1 - (keep | int) -%}
        {{ 'p%04d_%02d' | format(a // 12, a % 12 + 1) }}
  - variables:
      obsolete: "{{ existing | select('lt', threshold) | sort | list }}"

  - condition: template
    value_template: "{{ obsolete | count > 0 }}"

  - action: pyscript.sql_execute
    data:
      login: !input login
      database: !input database
      host: !input host
      port: !input port
      query: "ALTER TABLE `{{ table_name }}` DROP PARTITION {{ obsolete | join(', ') }}"
