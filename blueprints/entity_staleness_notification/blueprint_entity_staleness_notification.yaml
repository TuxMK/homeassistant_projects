# Stale entities detection - full report with all fields

  stale_sensors: >-
    {% set threshold_seconds = staleness_hours * 3600 %}
    {% set env_device_classes = ['temperature', 'humidity', 'pressure', 'atmospheric_pressure', 'carbon_dioxide', 'carbon_monoxide', 'volatile_organic_compounds', 'volatile_organic_compounds_parts', 'pm1', 'pm10', 'pm25', 'nitrogen_dioxide', 'ozone', 'sulphur_dioxide', 'aqi'] %}
    {% set security_binary_classes = ['door', 'window', 'motion', 'occupancy', 'vibration', 'tamper', 'smoke', 'gas', 'safety', 'lock'] %}
    {% set energy_device_classes = ['energy', 'power', 'voltage', 'current', 'power_factor', 'frequency', 'apparent_power', 'reactive_power'] %}
    {% set battery_sensor_classes = ['battery'] %}
    {% set battery_binary_classes = ['battery'] %}
    {% set stale_list = namespace(sensors=[]) %}
    {% for state in states %}
      {% if state.entity_id not in all_exclude_entities %}
        {% if exclude_unavailable == 'exclude_unavailable_enabled' and state.state in ['unavailable', 'unknown'] %}
          {% continue %}
        {% endif %}
        {% set matched = namespace(val=false) %}
        {% if 'environment' in domain_categories %}
          {% if state.domain == 'sensor' and state.attributes.device_class is defined and state.attributes.device_class in env_device_classes %}
            {% set matched.val = true %}
          {% endif %}
        {% endif %}
        {% if 'security' in domain_categories %}
          {% if state.domain == 'binary_sensor' and state.attributes.device_class is defined and state.attributes.device_class in security_binary_classes %}
            {% set matched.val = true %}
          {% endif %}
          {% if state.domain == 'lock' %}
            {% set matched.val = true %}
          {% endif %}
        {% endif %}
        {% if 'energy' in domain_categories %}
          {% if state.domain == 'sensor' and state.attributes.device_class is defined and state.attributes.device_class in energy_device_classes %}
            {% set matched.val = true %}
          {% endif %}
        {% endif %}
        {% if 'battery' in domain_categories %}
          {% if state.domain == 'sensor' and state.attributes.device_class is defined and state.attributes.device_class in battery_sensor_classes %}
            {% set matched.val = true %}
          {% endif %}
          {% if state.domain == 'binary_sensor' and state.attributes.device_class is defined and state.attributes.device_class in battery_binary_classes %}
            {% set matched.val = true %}
          {% endif %}
        {% endif %}
        {% if state.entity_id in individual_entity_list %}
          {% set matched.val = true %}
        {% endif %}
        {% if matched.val %}
          {% set age_seconds = (as_timestamp(now()) - as_timestamp(state.last_updated)) %}
          {% if age_seconds > threshold_seconds %}
            {% if 'friendly_name' in staleness_report_fields %}
              {% set friendly_name_text = state.name %}
            {% else %}
              {% set friendly_name_text = '' %}
            {% endif %}
            {% if 'floor' in staleness_report_fields %}
              {% set floor = floor_name(state.entity_id) %}
              {% set floor_text = ' {' ~ floor ~ '}' if floor is not none else '' %}
            {% else %}
              {% set floor_text = '' %}
            {% endif %}
            {% if 'area' in staleness_report_fields %}
              {% set area = area_name(state.entity_id) %}
              {% set area_text = ' (' ~ area ~ ')' if area is not none else '' %}
            {% else %}
              {% set area_text = '' %}
            {% endif %}
            {% if 'device' in staleness_report_fields %}
              {% set dev_id = device_id(state.entity_id) %}
              {% if dev_id is not none %}
                {% set dev_name = device_attr(dev_id, 'name_by_user') or device_attr(dev_id, 'name') %}
                {% set device_text = ' [' ~ dev_name ~ ']' if dev_name else '' %}
              {% else %}
                {% set device_text = '' %}
              {% endif %}
            {% else %}
              {% set device_text = '' %}
            {% endif %}
            {% if 'entity_id' in staleness_report_fields %}
              {% set entity_id_text = state.entity_id %}
            {% else %}
              {% set entity_id_text = '' %}
            {% endif %}
            {% if 'time_since_update' in staleness_report_fields %}
              {% set days = (age_seconds // 86400) | int %}
              {% set hours = ((age_seconds % 86400) // 3600) | int %}
              {% set minutes = ((age_seconds % 3600) // 60) | int %}
              {% if days > 0 %}
                {% set time_text = '| ' ~ days ~ 'd ' ~ hours ~ 'h' %}
              {% else %}
                {% set time_text = '| ' ~ hours ~ 'h ' ~ minutes ~ 'm' %}
              {% endif %}
            {% else %}
              {% set time_text = '' %}
            {% endif %}
            {% set report_fields = [
              friendly_name_text ~ floor_text ~ area_text ~ device_text,
              entity_id_text,
              time_text
            ] | reject('equalto', '') | join(' - ') %}
            {% set stale_list.sensors = stale_list.sensors + [report_fields] %}
          {% endif %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ stale_list.sensors | join(', ') }}

# Stale entities - friendly names only

