blueprint:
  name: Metrics Archive (MariaDB) — archive sensor records
  description: >
    # Metrics Archive (MariaDB) — archive sensor records

    **Version: 1.4**


    Writes sensor values into a dedicated MariaDB database through the pyscript
    connector `pyscript.sql_execute` (long-term archive, replacing the InfluxDB
    integration).


    Entities, database, table, login, host and port are all configured here in the
    automation — nothing of that is hardcoded in the blueprint or in the connector.
    The same blueprint can therefore be used several times, for example with
    different tables or intervals per group of sensors.


    <details>
    <summary><b>Write logic</b></summary>

      - **First change after a quiet period:** written immediately.
      - **Further changes within the interval:** collected, and only the **latest**
        value is written once the interval has elapsed.
      - **No change:** nothing is written.

      All due values of a run go to the database as **one single** INSERT with a
      multi-row `VALUES` clause — one connection per run instead of one per value.

      The stored timestamp is always the entity's real `last_changed` (UTC), never
      the moment of writing.
    </details>


    <details>
    <summary><b>Requirements</b></summary>

      - MariaDB add-on with its own database (e. g. `ha_metrics`) and target table.
      - pyscript (HACS) with the app `ha_mysql.py` and a login in the
        `configuration.yaml` (username/password via `secrets.yaml`).
      - The table needs the primary key `(entity_id, ts)`.

      Details and the `CREATE TABLE` statement are in the blueprint's README.
    </details>
  domain: automation
  input:
    quelle:
      name: Source
      icon: mdi:counter
      input:
        entities:
          name: Entities
          description: >
            The sensors to archive. Non-numeric states
            (`unknown`, `unavailable`, text) are skipped.
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor

    ziel:
      name: Target
      icon: mdi:database
      input:
        database:
          name: Database
          description: >
            Name of the MariaDB database that is written to.
          default: ha_metrics
          selector:
            text:
        table:
          name: Table
          description: >
            Target table with the columns `entity_id`, `ts`, `value`, `unit`
            and the primary key `(entity_id, ts)`.
          default: states
          selector:
            text:
        login:
          name: Login
          description: >
            Name of the login from the pyscript app configuration (e. g. `homeassistant`).
            It selects the database user that is used for writing.
            Leave empty to use the `default_login` configured there.
          default: ""
          selector:
            text:

    verhalten:
      name: Write behavior
      icon: mdi:timer-cog-outline
      collapsed: true
      input:
        throttle_seconds:
          name: Minimum spacing
          description: >
            Minimum spacing between two archived values of the same entity
            (in seconds). 10 = at most one value every 10 seconds per entity,
            60 = at most one per minute. This directly determines how fast the
            table grows.
          default: 10
          selector:
            number:
              min: 10
              max: 3600
              step: 10
              unit_of_measurement: seconds
              mode: box
        write_immediately:
          name: Write first change immediately
          description: >
            Writes the first change after a quiet period without delay.
            When turned off, every value is written by the next sweep run only.
          default: true
          selector:
            boolean:
        sweep_seconds:
          name: Sweep interval
          description: >
            How often collected changes are written (in seconds). Determines the
            accuracy of the minimum spacing — a value less than or equal to the
            minimum spacing makes sense. The interval has to divide 60 seconds
            evenly, hence a fixed list instead of a free number.
          default: "/10"
          selector:
            select:
              options:
                - label: Every 5 seconds
                  value: "/5"
                - label: Every 10 seconds
                  value: "/10"
                - label: Every 15 seconds
                  value: "/15"
                - label: Every 20 seconds
                  value: "/20"
                - label: Every 30 seconds
                  value: "/30"
                - label: Every 60 seconds
                  value: "0"

    verbindung:
      name: Connection (advanced)
      icon: mdi:lan-connect
      collapsed: true
      input:
        host:
          name: Host
          description: Database host. Inside Home Assistant `core-mariadb`.
          default: core-mariadb
          selector:
            text:
        port:
          name: Port
          default: 3306
          selector:
            number:
              min: 1
              max: 65535
              mode: box

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input entities
    id: change
  - trigger: time_pattern
    seconds: !input sweep_seconds
    id: sweep

variables:
  entities: !input entities
  database: !input database
  table: !input table
  login: !input login
  host: !input host
  port: !input port
  throttle: !input throttle_seconds
  immediate: !input write_immediately

  # Strip backticks from the table name so it can safely go into the SQL
  table_name: "{{ table | replace('`', '') }}"

  # Which entities are checked in this run: always all of them, no matter what
  # triggered. Sensors commonly change in the same millisecond - a sum sensor
  # follows its sources instantly - and mode single would drop those triggers.
  # Whichever run gets through therefore writes on behalf of every entity; what
  # is actually written is decided by the minimum spacing further down.
  # A state change only starts a run at all when immediate writing is enabled.
  candidates: >-
    {%- if trigger.id == 'sweep' or immediate -%}
      {{ entities }}
    {%- else -%}
      {{ [] }}
    {%- endif -%}

actions:
  - condition: template
    value_template: "{{ candidates | count > 0 }}"

  # Fetch the last archived timestamp per entity - one single SELECT, and
  # deliberately without any parameters: the primary key (entity_id, ts) lets
  # MariaDB answer MAX(ts) per group from the index alone, and the result has
  # one row per entity in the table. Filtering happens below in the template.
  - action: pyscript.sql_execute
    data:
      login: !input login
      database: !input database
      host: !input host
      port: !input port
      query: >-
        SELECT entity_id, UNIX_TIMESTAMP(MAX(ts)) AS last_ts
        FROM `{{ table_name }}`
        GROUP BY entity_id
    response_variable: archive

  - condition: template
    value_template: "{{ archive.ok | default(false) }}"

  - variables:
      archived: >-
        {%- set ns = namespace(m={}) -%}
        {%- for r in archive.rows | default([], true) -%}
          {%- set ns.m = dict(ns.m, **{r.entity_id: r.last_ts}) -%}
        {%- endfor -%}
        {{ ns.m }}

  # Collect the due rows: one entry [entity_id, ts, value, unit] each
  #   - the entity has to exist and carry a numeric state; an entity_id that no
  #     longer exists yields none here, and touching its last_changed would
  #     fail the whole template - and with it the entire run
  #   - the unit goes through ~ '' to force a plain string: integrations hand
  #     out enum members such as UnitOfEnergy.KILO_WATT_HOUR, and their repr
  #     breaks the list this template renders, so Home Assistant keeps the
  #     result as text and the run dies with "for_each must be a list of
  #     items". A | string filter does not help - the enum subclasses str and
  #     is passed through unchanged.
  #   - nothing archived yet -> write
  #   - otherwise only if there is something new (ts > last_ts) and the
  #     minimum spacing has passed since the last archived value
  - variables:
      due_rows: >-
        {%- set ns = namespace(rows=[]) -%}
        {%- for e in candidates -%}
          {%- set st = states[e] -%}
          {%- if st is not none and is_number(st.state) -%}
            {%- set last_ts = archived.get(e) -%}
            {%- set ts = as_timestamp(st.last_changed) -%}
            {%- set unit = state_attr(e, 'unit_of_measurement') -%}
            {%- if last_ts is none
                   or (ts > last_ts
                       and as_timestamp(now()) - last_ts >= throttle) -%}
              {%- set ns.rows = ns.rows + [[
                    e,
                    st.last_changed.strftime('%Y-%m-%d %H:%M:%S.%f')[:23],
                    st.state | float,
                    (unit ~ '') if unit is not none else none]] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.rows }}

  - condition: template
    value_template: "{{ due_rows | count > 0 }}"

  # One INSERT per due value. Every statement has a fixed shape with exactly
  # four placeholders, so nothing about the SQL depends on how many entities
  # are due in this run.
  - repeat:
      for_each: "{{ due_rows }}"
      sequence:
        - action: pyscript.sql_execute
          continue_on_error: true
          data:
            login: !input login
            database: !input database
            host: !input host
            port: !input port
            query: >-
              INSERT INTO `{{ table_name }}` (entity_id, ts, value, unit)
              VALUES (%s, %s, %s, %s)
              ON DUPLICATE KEY UPDATE value = VALUES(value), unit = VALUES(unit)
            params: "{{ repeat.item }}"
