blueprint:
  name: Climate Alarm - Temperatur & Feuchtigkeitsueberwachung
  description: >
    # Climate Alarm - Temperatur & Feuchtigkeitsueberwachung

    **Version: 1.0**


    Echtzeit-Ueberwachung von Temperatur- und Feuchtigkeitssensoren mit konfigurierbaren Normbereichen, Hysterese und Prioritaetslogik.


    <details>
    <summary><b>Funktionsweise:</b></summary>

      - **Echtzeit-Trigger:**
        - Reagiert sofort auf Zustandsaenderungen der ausgewaehlten Sensoren.
        - Alarm wird ausgeloest, sobald ein Sensorwert den Normbereich verlaesst.
        - Entwarnung wird gesendet, sobald alle Sensoren wieder im Normbereich sind.

      - **Sensor-Auswahl:**
        - Waehle einen oder mehrere Temperatursensoren.
        - Waehle einen oder mehrere Feuchtigkeitssensoren.
        - Definiere jeweils einen Normbereich (Min/Max).

      - **Hysterese:**
        - Konfigurierbarer Hysterese-Wert verhindert Alarm-Flackern an Grenzwerten.
        - Beispiel: Alarm bei >26 Grad C, Entwarnung erst bei <25 Grad C (1 Grad Hysterese).

      - **Prioritaet:**
        - Temperaturalarme haben Vorrang vor Feuchtigkeitsalarmen.
        - Bei gleichzeitigem Temperatur- und Feuchtigkeitsalarm werden nur Temperatur-Aktionen ausgefuehrt.
        - Feuchtigkeitsalarme werden nachgeholt, sobald der Temperaturalarm endet.

      - **Benachrichtigungsoptionen:**
        - Getrennte Aktionen fuer Temperatur- und Feuchtigkeitsalarme.
        - Push-Benachrichtigungen (iOS/Android).
        - UI-Benachrichtigungen.
        - Dashboard-Benachrichtigungen via Text Helper.
        - To-Do Liste Integration mit Action Buttons.
        - Custom Actions.

      - **Voraussetzungen:**
        - 2 Input Boolean Helper erstellen (Temperatur-Alarm-Status, Feuchtigkeits-Alarm-Status).
    </details>


    Required = *
  domain: automation
  input:
    sensor_settings:
      name: "Sensor-Einstellungen *"
      icon: mdi:thermometer-alert
      description: >
        Sensoren, Normbereiche, Hysterese und Alarm-Status-Helper konfigurieren.
      collapsed: true
      input:
        temperature_sensors:
          name: Temperatursensoren (Optional)
          description: >
            Waehle die Temperatursensoren aus, die ueberwacht werden sollen.
            Alle ausgewaehlten Sensoren teilen sich denselben Normbereich.
            Fuer unterschiedliche Bereiche (z.B. Kuehlschrank vs. Wohnzimmer) erstelle separate Automationen.
          default: []
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
              multiple: true
        humidity_sensors:
          name: Feuchtigkeitssensoren (Optional)
          description: >
            Waehle die Feuchtigkeitssensoren aus, die ueberwacht werden sollen.
            Alle ausgewaehlten Sensoren teilen sich denselben Normbereich.
          default: []
          selector:
            entity:
              filter:
                domain: sensor
                device_class: humidity
              multiple: true
        temp_min:
          name: "Temperatur Untergrenze *"
          description: >
            Minimale Temperatur in Grad Celsius. Ein Alarm wird ausgeloest, wenn ein Sensor diesen Wert unterschreitet.
          default: 18
          selector:
            number:
              min: -40
              max: 80
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        temp_max:
          name: "Temperatur Obergrenze *"
          description: >
            Maximale Temperatur in Grad Celsius. Ein Alarm wird ausgeloest, wenn ein Sensor diesen Wert ueberschreitet.
          default: 26
          selector:
            number:
              min: -40
              max: 80
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        hum_min:
          name: "Feuchtigkeit Untergrenze *"
          description: >
            Minimale relative Luftfeuchtigkeit in Prozent.
          default: 30
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: box
        hum_max:
          name: "Feuchtigkeit Obergrenze *"
          description: >
            Maximale relative Luftfeuchtigkeit in Prozent.
          default: 70
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: box
        hysteresis:
          name: Hysterese
          description: >
            Hysterese-Wert zur Vermeidung von Alarm-Flackern an den Grenzwerten.
            Der Wert wird fuer die Entwarnung vom Grenzwert abgezogen (Obergrenze) bzw. addiert (Untergrenze).


            **Beispiel:** Obergrenze 26 Grad C mit Hysterese 1 -> Alarm bei >26 Grad C, Entwarnung bei <25 Grad C.


            Setze den Wert auf 0, um keine Hysterese zu verwenden.
          default: 1.0
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
              unit_of_measurement: "°C / %"
              mode: box
        temp_alarm_boolean:
          name: "Temperatur-Alarm Status Helper *"
          description: >
            Waehle einen Input Boolean Helper, der den Temperatur-Alarm-Status speichert.
            Erstelle diesen unter Einstellungen -> Geraete & Dienste -> Helfer -> Schalter (Input Boolean).


            Dieser Helper wird automatisch ein-/ausgeschaltet und speichert ob ein Temperaturalarm aktiv ist.
          default: []
          selector:
            entity:
              filter:
                domain: input_boolean
        hum_alarm_boolean:
          name: "Feuchtigkeits-Alarm Status Helper *"
          description: >
            Waehle einen Input Boolean Helper, der den Feuchtigkeits-Alarm-Status speichert.
            Erstelle diesen unter Einstellungen -> Geraete & Dienste -> Helfer -> Schalter (Input Boolean).


            Dieser Helper wird automatisch ein-/ausgeschaltet und speichert ob ein Feuchtigkeitsalarm aktiv ist.
          default: []
          selector:
            entity:
              filter:
                domain: input_boolean

    # ============================================================
    # TEMPERATUR-ALARM BENACHRICHTIGUNGEN
    # ============================================================
    temp_alarm_notify:
      name: "Temperatur-Alarm - Benachrichtigungen"
      icon: mdi:thermometer-high
      description: >
        Aktionen die ausgefuehrt werden, wenn ein Temperatursensor den Normbereich verlaesst.
      collapsed: true
      input:
        # -- Device Notification --
        temp_alarm_include_device_notify:
          name: Geraete-Benachrichtigung (Optional)
          description: >
            Push-Benachrichtigung an mobile Geraete senden.
          default: disabled
          selector:
            select:
              options:
                - label: Aktivieren
                  value: "enabled"
                - label: Deaktivieren
                  value: "disabled"
        temp_alarm_notify_device:
          name: Geraete
          description: >
            Waehle die Geraete, die benachrichtigt werden sollen.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true
        temp_alarm_notify_title:
          name: Titel
          description: >
            Titel der Push-Benachrichtigung.
          default: Temperaturalarm!
          selector:
            text:
        temp_alarm_notify_message:
          name: Nachricht
          description: >
            Nachricht der Push-Benachrichtigung. Verfuegbare Variablen:

            - `{{trigger_sensor_name}}` - Sensorname

            - `{{trigger_value}}` - Aktueller Messwert

            - `{{temp_min}}` / `{{temp_max}}` - Grenzwerte

            - `{{all_temp_alarm_sensors}}` - Alle Sensoren im Alarm
          default: "{{trigger_sensor_name}}: {{trigger_value}} °C liegt ausserhalb des Normbereichs ({{temp_min}} - {{temp_max}} °C)"
          selector:
            text:
              multiline: true
        temp_alarm_notify_tag:
          name: Notification Tag
          description: >
            Ein Tag haelt Benachrichtigungen organisiert. Eine neue Benachrichtigung mit gleichem Tag ersetzt die vorherige.
            Leer lassen fuer separate Benachrichtigungen.
          default: []
          selector:
            text:
        temp_alarm_notify_interruption_level:
          name: Interruption Level - iOS
          description: >
            Unterbrechungsstufe fuer iOS 15+.
          default: active
          selector:
            select:
              mode: dropdown
              options:
                - label: Standard
                  value: "active"
                - label: Kritisch
                  value: "critical"
                - label: Zeitkritisch
                  value: "time-sensitive"
                - label: Leise (ohne Bildschirm zu wecken)
                  value: "passive"
        temp_alarm_notify_sound:
          name: Benachrichtigungston - iOS
          description: >
            Dateiname des Benachrichtigungstons inkl. Dateiendung.
          default: []
          selector:
            text:
        temp_alarm_notify_data:
          name: Android Optionen (Optional)
          description: >
            **High Priority** - Sofortige Zustellung.

            **Sticky Notification** - Bleibt bis zum manuellen Entfernen.

            **Notification Channel** - Eigener Benachrichtigungskanal.

            **Icon** - Eigenes Icon.
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: High Priority
                  value: "high_priority"
                - label: Sticky Notification
                  value: "sticky"
                - label: Notification Channel
                  value: "channel"
                - label: Icon
                  value: "icon"
        temp_alarm_notify_channel:
          name: Notification Channel - Android
          description: >
            Name des Benachrichtigungskanals.
          default: []
          selector:
            text:
        temp_alarm_notify_icon:
          name: Icon - Android
          description: >
            Eigenes Icon fuer die Benachrichtigung.
          default: "mdi:thermometer-alert"
          selector:
            icon:
        temp_alarm_notify_icon_colour:
          name: Icon Farbe - Android
          description: >
            Farbe des Benachrichtigungsicons.
          default: [244, 67, 54]
          selector:
            color_rgb:
        # -- UI Notification --
        temp_alarm_include_ui_notify:
          name: UI-Benachrichtigung (Optional)
          description: >
            Benachrichtigung in der Home Assistant Oberflaeche anzeigen.
          default: disabled
          selector:
            select:
              options:
                - label: Aktivieren
                  value: "enabled"
                - label: Deaktivieren
                  value: "disabled"
        temp_alarm_ui_notify_title:
          name: UI Titel
          description: >
            Titel der UI-Benachrichtigung.
          default: Temperaturalarm!
          selector:
            text:
        temp_alarm_ui_notify_message:
          name: UI Nachricht
          description: >
            Nachricht der UI-Benachrichtigung. Gleiche Variablen wie bei Geraete-Benachrichtigung verfuegbar.
          default: "{{trigger_sensor_name}}: {{trigger_value}} °C liegt ausserhalb des Normbereichs ({{temp_min}} - {{temp_max}} °C)"
          selector:
            text:
              multiline: true
        temp_alarm_ui_notify_id:
          name: UI Notification ID
          description: >
            Eine ID haelt Benachrichtigungen organisiert. Leer lassen fuer separate Benachrichtigungen.
          default: []
          selector:
            text:
        # -- Dashboard Notification --
        temp_alarm_include_dashboard_notify:
          name: Dashboard-Benachrichtigung (Optional)
          description: >
            Alarm-Status auf einem Dashboard anzeigen via Text Helper.
          default: disabled
          selector:
            select:
              options:
                - label: Aktivieren
                  value: "enabled"
                - label: Deaktivieren
                  value: "disabled"
        temp_alarm_dashboard_text_helper:
          name: Dashboard Text Helper
          description: >
            Waehle den Text Helper fuer die Dashboard-Anzeige.
          default: []
          selector:
            entity:
              filter:
                domain: input_text
        # -- To-Do Integration --
        temp_alarm_include_todo:
          name: To-Do Liste (Optional)
          description: >
            Alarm direkt in eine To-Do Liste eintragen.
          default: disabled
          selector:
            select:
              options:
                - label: Aktivieren
                  value: "enabled"
                - label: Deaktivieren
                  value: "disabled"
        temp_alarm_todo_list:
          name: To-Do Liste
          description: >
            Waehle die To-Do Liste. Die Standard-Einkaufsliste ist nicht kompatibel.
          default: []
          selector:
            entity:
              filter:
                domain: todo
        temp_alarm_todo_title:
          name: To-Do Aufgabentitel
          description: >
            Titel der To-Do Aufgabe.
          default: "Temperaturalarm pruefen"
          selector:
            text:
        # -- Action Buttons --
        temp_alarm_notify_action_buttons:
          name: Action Buttons (Optional)
          description: >
            Interaktive Buttons in der Push-Benachrichtigung zum Hinzufuegen in eine To-Do Liste.


            ***Hinweis** - Fuer **Clear on Action** muss ein Notification Tag gesetzt sein.*
          default: disabled
          selector:
            select:
              options:
                - label: To-Do Action Buttons
                  value: "enable_todo_button"
                - label: To-Do Action Buttons + Bestaetigung
                  value: "enable_todo_button_confirmation"
                - label: To-Do Action Buttons + Bei Aktion loeschen
                  value: "enable_todo_button_clear"
                - label: Deaktivieren
                  value: "disabled"
        temp_alarm_action_button_todo:
          name: Action Button Label
          description: >
            Beschriftung des Action Buttons.
          default: "Zur To-Do Liste!"
          selector:
            text:
        temp_alarm_action_button_cancel:
          name: Cancel Button Label
          description: >
            Beschriftung des Abbrechen-Buttons.
          default: "Abbrechen"
          selector:
            text:
        temp_alarm_action_button_confirmation_title:
          name: Bestaetigungs-Titel
          description: >
            Titel der Bestaetigungsbenachrichtigung.
          default: "Temperaturalarm - Bestaetigung"
          selector:
            text:
        temp_alarm_action_button_confirmation_message:
          name: Bestaetigungs-Nachricht (Action)
          description: >
            Nachricht bei Druecken des Action Buttons.
          default: "Temperaturalarm wurde zur To-Do Liste hinzugefuegt"
          selector:
            text:
        temp_alarm_cancel_button_confirmation_message:
          name: Bestaetigungs-Nachricht (Abbrechen)
          description: >
            Nachricht bei Druecken des Abbrechen-Buttons.
          default: "Abgebrochen - nichts wurde hinzugefuegt"
          selector:
            text:
        # -- Custom Actions --
        temp_alarm_include_custom_actions:
          name: Custom Actions (Optional)
          description: >
            Eigene Aktionen ausfuehren bei Temperaturalarm.
          default: disabled
          selector:
            select:
              options:
                - label: Aktivieren
                  value: "enabled"
                - label: Deaktivieren
                  value: "disabled"
        temp_alarm_custom_actions:
          name: Custom Actions
          description: >
            Eigene Aktionen. Verfuegbare Variablen:

            `{{trigger_sensor_name}}`, `{{trigger_value}}`, `{{trigger_entity}}`,
            `{{temp_min}}`, `{{temp_max}}`, `{{all_temp_alarm_sensors}}`
          default: []
          selector:
            action:

