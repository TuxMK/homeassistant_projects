          default: disabled
          selector:
            select:
              options:
                - label: Aktivieren
                  value: "enabled"
                - label: Deaktivieren
                  value: "disabled"
        temp_clear_custom_actions:
          name: Custom Actions
          description: >
            Eigene Aktionen bei Entwarnung.
          default: []
          selector:
            action:

