# ============================================================
# AUTOMATION SETTINGS
# ============================================================
mode: queued
max: 10
max_exceeded: silent

# ============================================================
# VARIABLES
# ============================================================
variables:
  # Sensor settings
  temperature_sensors: !input temperature_sensors
  humidity_sensors: !input humidity_sensors
  temp_min: !input temp_min
  temp_max: !input temp_max
  hum_min: !input hum_min
  hum_max: !input hum_max
  hysteresis: !input hysteresis
  temp_alarm_boolean: !input temp_alarm_boolean
  hum_alarm_boolean: !input hum_alarm_boolean

  # Hysteresis-adjusted thresholds for all-clear
  temp_clear_min: "{{ (temp_min | float) + (hysteresis | float) }}"
  temp_clear_max: "{{ (temp_max | float) - (hysteresis | float) }}"
  hum_clear_min: "{{ (hum_min | float) + (hysteresis | float) }}"
  hum_clear_max: "{{ (hum_max | float) - (hysteresis | float) }}"

  # Trigger context
  trigger_entity: "{{ trigger.entity_id }}"
  trigger_value: "{{ trigger.to_state.state | float(0) }}"
  trigger_sensor_name: "{{ state_attr(trigger.entity_id, 'friendly_name') | default(trigger.entity_id) }}"

  # Current alarm states
  is_temp_alarm_active: "{{ states(temp_alarm_boolean) == 'on' if temp_alarm_boolean else false }}"
  is_hum_alarm_active: "{{ states(hum_alarm_boolean) == 'on' if hum_alarm_boolean else false }}"

  # All sensors alarm list (for notifications)
  all_temp_alarm_sensors: >-
    {% set ns = namespace(sensors=[]) %}
    {% for sid in temperature_sensors %}
      {% set val = states(sid) | float(none) %}
      {% if val is not none and (val > (temp_max | float) or val < (temp_min | float)) %}
        {% set name = state_attr(sid, 'friendly_name') | default(sid) %}
        {% set area = area_name(sid) %}
        {% set area_text = ' (' ~ area ~ ')' if area is not none else '' %}
        {% set ns.sensors = ns.sensors + [name ~ area_text ~ ': ' ~ val ~ ' °C'] %}
      {% endif %}
    {% endfor %}
    {{ ns.sensors | join('\n') }}

  all_hum_alarm_sensors: >-
    {% set ns = namespace(sensors=[]) %}
    {% for sid in humidity_sensors %}
      {% set val = states(sid) | float(none) %}
      {% if val is not none and (val > (hum_max | float) or val < (hum_min | float)) %}
        {% set name = state_attr(sid, 'friendly_name') | default(sid) %}
        {% set area = area_name(sid) %}
        {% set area_text = ' (' ~ area ~ ')' if area is not none else '' %}
        {% set ns.sensors = ns.sensors + [name ~ area_text ~ ': ' ~ val ~ ' %'] %}
      {% endif %}
    {% endfor %}
    {{ ns.sensors | join('\n') }}

  # All-clear checks
  all_temp_in_range: >-
    {% set ns = namespace(all_ok=true) %}
    {% for sid in temperature_sensors %}
      {% set val = states(sid) | float(none) %}
      {% if val is none or val > (temp_clear_max | float) or val < (temp_clear_min | float) %}
        {% set ns.all_ok = false %}
      {% endif %}
    {% endfor %}
    {{ ns.all_ok }}

  all_hum_in_range: >-
    {% set ns = namespace(all_ok=true) %}
    {% for sid in humidity_sensors %}
      {% set val = states(sid) | float(none) %}
      {% if val is none or val > (hum_clear_max | float) or val < (hum_clear_min | float) %}
        {% set ns.all_ok = false %}
      {% endif %}
    {% endfor %}
    {{ ns.all_ok }}

  # Temp alarm notification inputs
  temp_alarm_include_device_notify: !input temp_alarm_include_device_notify
  temp_alarm_notify_device: !input temp_alarm_notify_device
  temp_alarm_notify_title: !input temp_alarm_notify_title
  temp_alarm_notify_message: !input temp_alarm_notify_message
  temp_alarm_notify_tag: !input temp_alarm_notify_tag
  temp_alarm_notify_interruption_level: !input temp_alarm_notify_interruption_level
  temp_alarm_notify_sound: !input temp_alarm_notify_sound
  temp_alarm_notify_data: !input temp_alarm_notify_data
  temp_alarm_notify_channel: !input temp_alarm_notify_channel
  temp_alarm_notify_icon: !input temp_alarm_notify_icon
  temp_alarm_notify_icon_colour: !input temp_alarm_notify_icon_colour
  temp_alarm_include_ui_notify: !input temp_alarm_include_ui_notify
  temp_alarm_ui_notify_title: !input temp_alarm_ui_notify_title
  temp_alarm_ui_notify_message: !input temp_alarm_ui_notify_message
  temp_alarm_ui_notify_id: !input temp_alarm_ui_notify_id
  temp_alarm_include_dashboard_notify: !input temp_alarm_include_dashboard_notify
  temp_alarm_dashboard_text_helper: !input temp_alarm_dashboard_text_helper
  temp_alarm_include_todo: !input temp_alarm_include_todo
  temp_alarm_todo_list: !input temp_alarm_todo_list
  temp_alarm_todo_title: !input temp_alarm_todo_title
  temp_alarm_notify_action_buttons: !input temp_alarm_notify_action_buttons
  temp_alarm_action_button_todo: !input temp_alarm_action_button_todo
  temp_alarm_action_button_cancel: !input temp_alarm_action_button_cancel
  temp_alarm_action_button_confirmation_title: !input temp_alarm_action_button_confirmation_title
  temp_alarm_action_button_confirmation_message: !input temp_alarm_action_button_confirmation_message
  temp_alarm_cancel_button_confirmation_message: !input temp_alarm_cancel_button_confirmation_message
  temp_alarm_include_custom_actions: !input temp_alarm_include_custom_actions

  # Temp clear notification inputs
  temp_clear_include_device_notify: !input temp_clear_include_device_notify
  temp_clear_notify_device: !input temp_clear_notify_device
  temp_clear_notify_title: !input temp_clear_notify_title
  temp_clear_notify_message: !input temp_clear_notify_message
  temp_clear_notify_tag: !input temp_clear_notify_tag
  temp_clear_notify_interruption_level: !input temp_clear_notify_interruption_level
  temp_clear_notify_sound: !input temp_clear_notify_sound
  temp_clear_notify_data: !input temp_clear_notify_data
  temp_clear_notify_channel: !input temp_clear_notify_channel
  temp_clear_notify_icon: !input temp_clear_notify_icon
  temp_clear_notify_icon_colour: !input temp_clear_notify_icon_colour
  temp_clear_include_ui_notify: !input temp_clear_include_ui_notify
  temp_clear_ui_notify_title: !input temp_clear_ui_notify_title
  temp_clear_ui_notify_message: !input temp_clear_ui_notify_message
  temp_clear_ui_notify_id: !input temp_clear_ui_notify_id
  temp_clear_include_dashboard_notify: !input temp_clear_include_dashboard_notify
  temp_clear_dashboard_text_helper: !input temp_clear_dashboard_text_helper
  temp_clear_include_custom_actions: !input temp_clear_include_custom_actions

  # Hum alarm notification inputs
  hum_alarm_include_device_notify: !input hum_alarm_include_device_notify
  hum_alarm_notify_device: !input hum_alarm_notify_device
  hum_alarm_notify_title: !input hum_alarm_notify_title
  hum_alarm_notify_message: !input hum_alarm_notify_message
  hum_alarm_notify_tag: !input hum_alarm_notify_tag
  hum_alarm_notify_interruption_level: !input hum_alarm_notify_interruption_level
  hum_alarm_notify_sound: !input hum_alarm_notify_sound
  hum_alarm_notify_data: !input hum_alarm_notify_data
  hum_alarm_notify_channel: !input hum_alarm_notify_channel
  hum_alarm_notify_icon: !input hum_alarm_notify_icon
  hum_alarm_notify_icon_colour: !input hum_alarm_notify_icon_colour
  hum_alarm_include_ui_notify: !input hum_alarm_include_ui_notify
  hum_alarm_ui_notify_title: !input hum_alarm_ui_notify_title
  hum_alarm_ui_notify_message: !input hum_alarm_ui_notify_message
  hum_alarm_ui_notify_id: !input hum_alarm_ui_notify_id
  hum_alarm_include_dashboard_notify: !input hum_alarm_include_dashboard_notify
  hum_alarm_dashboard_text_helper: !input hum_alarm_dashboard_text_helper
  hum_alarm_include_todo: !input hum_alarm_include_todo
  hum_alarm_todo_list: !input hum_alarm_todo_list
  hum_alarm_todo_title: !input hum_alarm_todo_title
  hum_alarm_notify_action_buttons: !input hum_alarm_notify_action_buttons
  hum_alarm_action_button_todo: !input hum_alarm_action_button_todo
  hum_alarm_action_button_cancel: !input hum_alarm_action_button_cancel
  hum_alarm_action_button_confirmation_title: !input hum_alarm_action_button_confirmation_title
  hum_alarm_action_button_confirmation_message: !input hum_alarm_action_button_confirmation_message
  hum_alarm_cancel_button_confirmation_message: !input hum_alarm_cancel_button_confirmation_message
  hum_alarm_include_custom_actions: !input hum_alarm_include_custom_actions

  # Hum clear notification inputs
  hum_clear_include_device_notify: !input hum_clear_include_device_notify
  hum_clear_notify_device: !input hum_clear_notify_device
  hum_clear_notify_title: !input hum_clear_notify_title
  hum_clear_notify_message: !input hum_clear_notify_message
  hum_clear_notify_tag: !input hum_clear_notify_tag
  hum_clear_notify_interruption_level: !input hum_clear_notify_interruption_level
  hum_clear_notify_sound: !input hum_clear_notify_sound
  hum_clear_notify_data: !input hum_clear_notify_data
  hum_clear_notify_channel: !input hum_clear_notify_channel
  hum_clear_notify_icon: !input hum_clear_notify_icon
  hum_clear_notify_icon_colour: !input hum_clear_notify_icon_colour
  hum_clear_include_ui_notify: !input hum_clear_include_ui_notify
  hum_clear_ui_notify_title: !input hum_clear_ui_notify_title
  hum_clear_ui_notify_message: !input hum_clear_ui_notify_message
  hum_clear_ui_notify_id: !input hum_clear_ui_notify_id
  hum_clear_include_dashboard_notify: !input hum_clear_include_dashboard_notify
  hum_clear_dashboard_text_helper: !input hum_clear_dashboard_text_helper
  hum_clear_include_custom_actions: !input hum_clear_include_custom_actions

  # Device message data computation helpers (reusable macro pattern)
  temp_alarm_device_message_data: >-
    {% set message = namespace(data={}) %}
    {% set push = namespace(data={}) %}
    {% if temp_alarm_notify_interruption_level in ['active', 'critical', 'time-sensitive', 'passive'] %}
      {% set push.data = dict(push.data, **{ 'interruption-level': temp_alarm_notify_interruption_level }) %}
    {% endif %}
    {% if temp_alarm_notify_sound != [] %}
      {% set push.data = dict(push.data, **{ 'sound': temp_alarm_notify_sound }) %}
    {% endif %}
    {% if push.data %}
      {% set message.data = dict(message.data, **{ 'push': push.data }) %}
    {% endif %}
    {% if 'high_priority' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'ttl': 0, 'priority': 'high' }) %}
    {% endif %}
    {% if 'channel' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'channel': temp_alarm_notify_channel }) %}
    {% endif %}
    {% if 'sticky' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'sticky': "true" }) %}
    {% endif %}
    {% if 'icon' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'notification_icon': temp_alarm_notify_icon }) %}
      {% if temp_alarm_notify_icon_colour | length == 3 %}
        {% set icon_colour = '#%02x%02x%02x' | format(temp_alarm_notify_icon_colour[0], temp_alarm_notify_icon_colour[1], temp_alarm_notify_icon_colour[2]) %}
        {% set message.data = dict(message.data, **{ 'color': icon_colour }) %}
      {% endif %}
    {% endif %}
    {% if temp_alarm_notify_tag != [] %}
      {% set message.data = dict(message.data, **{ 'tag': temp_alarm_notify_tag }) %}
    {% endif %}
    {{ message.data }}

  temp_alarm_device_message_data_action_button: >-
    {% set message = namespace(data={}) %}
    {% set push = namespace(data={}) %}
    {% if temp_alarm_notify_interruption_level in ['active', 'critical', 'time-sensitive', 'passive'] %}
      {% set push.data = dict(push.data, **{ 'interruption-level': temp_alarm_notify_interruption_level }) %}
    {% endif %}
    {% if temp_alarm_notify_sound != [] %}
      {% set push.data = dict(push.data, **{ 'sound': temp_alarm_notify_sound }) %}
    {% endif %}
    {% if push.data %}
      {% set message.data = dict(message.data, **{ 'push': push.data }) %}
    {% endif %}
    {% if 'high_priority' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'ttl': 0, 'priority': 'high' }) %}
    {% endif %}
    {% if 'channel' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'channel': temp_alarm_notify_channel }) %}
    {% endif %}
    {% if 'sticky' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'sticky': "true" }) %}
    {% endif %}
    {% if 'icon' in temp_alarm_notify_data %}
      {% set message.data = dict(message.data, **{ 'notification_icon': temp_alarm_notify_icon }) %}
      {% if temp_alarm_notify_icon_colour | length == 3 %}
        {% set icon_colour = '#%02x%02x%02x' | format(temp_alarm_notify_icon_colour[0], temp_alarm_notify_icon_colour[1], temp_alarm_notify_icon_colour[2]) %}
        {% set message.data = dict(message.data, **{ 'color': icon_colour }) %}
      {% endif %}
    {% endif %}
    {% if temp_alarm_notify_tag != [] %}
      {% set message.data = dict(message.data, **{ 'tag': temp_alarm_notify_tag }) %}
    {% endif %}
    {% set actions = [
      {'action': temp_alarm_action_button_todo, 'title': temp_alarm_action_button_todo},
      {'action': temp_alarm_action_button_cancel, 'title': temp_alarm_action_button_cancel}
    ] %}
    {% set message.data = dict(message.data, **{ 'actions': actions }) %}
    {{ message.data }}

  temp_clear_device_message_data: >-
    {% set message = namespace(data={}) %}
    {% set push = namespace(data={}) %}
    {% if temp_clear_notify_interruption_level in ['active', 'critical', 'time-sensitive', 'passive'] %}
      {% set push.data = dict(push.data, **{ 'interruption-level': temp_clear_notify_interruption_level }) %}
    {% endif %}
    {% if temp_clear_notify_sound != [] %}
      {% set push.data = dict(push.data, **{ 'sound': temp_clear_notify_sound }) %}
    {% endif %}
    {% if push.data %}
      {% set message.data = dict(message.data, **{ 'push': push.data }) %}
    {% endif %}
    {% if 'high_priority' in temp_clear_notify_data %}
