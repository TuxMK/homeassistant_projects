# ============================================================
# TRIGGERS
# ============================================================
triggers:
  - trigger: state
    entity_id: !input temperature_sensors
    id: 'temp_change'
  - trigger: state
    entity_id: !input humidity_sensors
    id: 'hum_change'

# ============================================================
# CONDITIONS
# ============================================================
condition:
  # Filter non-numeric states (unavailable, unknown, etc.)
  - condition: template
    value_template: "{{ trigger.to_state.state | float(none) is not none }}"
  # Global conditions
  - condition: and
    conditions: !input global_conditions

# ============================================================
# ACTIONS
# ============================================================
action:
  - choose:
    # ========================================================
    # TEMPERATURE SENSOR CHANGE
    # ========================================================
    - alias: "Temperatursensor hat sich geaendert"
      conditions:
        - condition: trigger
          id: 'temp_change'
      sequence:
        - choose:
          # -- TEMPERATUR-ALARM: Wert ausserhalb Normbereich --
          - alias: "Temperatur ausserhalb Normbereich - Alarm ausloesen"
            conditions:
              - condition: template
                value_template: >-
                  {{ (trigger_value | float > temp_max | float) or
                     (trigger_value | float < temp_min | float) }}
              - condition: template
                value_template: "{{ not is_temp_alarm_active }}"
            sequence:
              # Set alarm boolean
              - action: input_boolean.turn_on
                target:
                  entity_id: !input temp_alarm_boolean
              # -- Custom Actions --
              - choose:
                - conditions:
                    - "{{ temp_alarm_include_custom_actions == 'enabled' }}"
                  sequence: !input temp_alarm_custom_actions
              # -- Device Notification --
              - choose:
                - alias: "Temp Alarm - Geraete-Benachrichtigung"
                  conditions:
                    - "{{ temp_alarm_include_device_notify == 'enabled' }}"
                    - "{{ temp_alarm_notify_device | length > 0 }}"
                  sequence:
                    - repeat:
                        for_each: !input temp_alarm_notify_device
                        sequence:
                          - choose:
                            - alias: "Ohne Action Buttons"
                              conditions:
                                - "{{ temp_alarm_notify_action_buttons == 'disabled' }}"
                              sequence:
                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                  data:
                                    title: "{{ temp_alarm_notify_title }}"
                                    message: "{{ temp_alarm_notify_message }}"
                                    data: "{{ temp_alarm_device_message_data }}"
                                  continue_on_error: true
                            - alias: "Mit Action Buttons"
                              conditions:
                                - "{{ temp_alarm_notify_action_buttons != 'disabled' }}"
                              sequence:
                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                  data:
                                    title: "{{ temp_alarm_notify_title }}"
                                    message: "{{ temp_alarm_notify_message }}"
                                    data: "{{ temp_alarm_device_message_data_action_button }}"
                                  continue_on_error: true
              # -- UI Notification --
              - choose:
                - alias: "Temp Alarm - UI-Benachrichtigung"
                  conditions:
                    - "{{ temp_alarm_include_ui_notify == 'enabled' }}"
                  sequence:
                    - action: persistent_notification.create
                      data:
                        title: "{{ temp_alarm_ui_notify_title }}"
                        message: "{{ temp_alarm_ui_notify_message }}"
                        notification_id: "{{ temp_alarm_ui_notify_id if temp_alarm_ui_notify_id != [] else '' }}"
              # -- Dashboard Notification --
              - choose:
                - alias: "Temp Alarm - Dashboard-Benachrichtigung"
                  conditions:
                    - "{{ temp_alarm_include_dashboard_notify == 'enabled' }}"
                  sequence:
                    - action: input_text.set_value
                      target:
                        entity_id: !input temp_alarm_dashboard_text_helper
                      data:
                        value: "{{ now().strftime('%d.%m.%Y %H:%M') }} - {{ temp_alarm_notify_message[:220] }}"
              # -- To-Do --
              - choose:
                - alias: "Temp Alarm - To-Do Eintrag"
                  conditions:
                    - "{{ temp_alarm_include_todo == 'enabled' }}"
                  sequence:
                    - action: todo.add_item
                      data:
                        item: "{{ temp_alarm_todo_title }}"
                        description: "{{ temp_alarm_notify_message }}"
                      target:
                        entity_id: !input temp_alarm_todo_list
              # -- Action Button Wait --
              - choose:
                - alias: "Temp Alarm - Action Buttons warten"
                  conditions:
                    - "{{ temp_alarm_include_device_notify == 'enabled' }}"
                    - "{{ temp_alarm_notify_action_buttons != 'disabled' }}"
                    - "{{ temp_alarm_notify_device | length > 0 }}"
                  sequence:
                    - wait_for_trigger:
                        - trigger: event
                          event_type: mobile_app_notification_action
                          event_data:
                            action: "{{ temp_alarm_action_button_todo }}"
                        - trigger: event
                          event_type: mobile_app_notification_action
                          event_data:
                            action: "{{ temp_alarm_action_button_cancel }}"
                    - choose:
                      - alias: "Action Button gedrueckt"
                        conditions:
                          - "{{ wait.trigger is defined and wait.trigger.idx is defined }}"
                        sequence:
                          - choose:
                            - conditions: "{{ wait.trigger.event.data.action == temp_alarm_action_button_todo }}"
                              sequence:
                                - action: todo.add_item
                                  data:
                                    item: "{{ temp_alarm_todo_title }}"
                                    description: "{{ temp_alarm_notify_message }}"
                                  target:
                                    entity_id: !input temp_alarm_todo_list
                                - choose:
                                  - conditions:
                                      - "{{ temp_alarm_notify_action_buttons == 'enable_todo_button_confirmation' }}"
                                    sequence:
                                      - repeat:
                                          for_each: !input temp_alarm_notify_device
                                          sequence:
                                            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                              data:
                                                title: "{{ temp_alarm_action_button_confirmation_title }}"
                                                message: "{{ temp_alarm_action_button_confirmation_message }}"
                                                data: "{{ temp_alarm_device_message_data }}"
                                              continue_on_error: true
                                  - conditions:
                                      - "{{ temp_alarm_notify_action_buttons == 'enable_todo_button_clear' }}"
                                    sequence:
                                      - repeat:
                                          for_each: !input temp_alarm_notify_device
                                          sequence:
                                            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                              data:
                                                message: clear_notification
                                                data:
                                                  tag: "{{ temp_alarm_notify_tag }}"
                                              continue_on_error: true
                            - conditions: "{{ wait.trigger.event.data.action == temp_alarm_action_button_cancel }}"
                              sequence:
                                - choose:
                                  - conditions:
                                      - "{{ temp_alarm_notify_action_buttons == 'enable_todo_button_confirmation' }}"
                                    sequence:
                                      - repeat:
                                          for_each: !input temp_alarm_notify_device
                                          sequence:
                                            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                              data:
                                                title: "{{ temp_alarm_action_button_confirmation_title }}"
                                                message: "{{ temp_alarm_cancel_button_confirmation_message }}"
                                                data: "{{ temp_alarm_device_message_data }}"
                                              continue_on_error: true
                                  - conditions:
                                      - "{{ temp_alarm_notify_action_buttons == 'enable_todo_button_clear' }}"
                                    sequence:
                                      - repeat:
                                          for_each: !input temp_alarm_notify_device
                                          sequence:
                                            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                              data:
                                                message: clear_notification
                                                data:
                                                  tag: "{{ temp_alarm_notify_tag }}"
                                              continue_on_error: true

          # -- TEMPERATUR-ENTWARNUNG: Alle Sensoren wieder im Bereich --
          - alias: "Temperatur wieder im Normbereich - Entwarnung"
            conditions:
              - condition: template
                value_template: >-
                  {{ (trigger_value | float <= temp_clear_max | float) and
                     (trigger_value | float >= temp_clear_min | float) }}
              - condition: template
                value_template: "{{ is_temp_alarm_active }}"
              - condition: template
                value_template: "{{ all_temp_in_range }}"
            sequence:
              # Clear alarm boolean
              - action: input_boolean.turn_off
                target:
                  entity_id: !input temp_alarm_boolean
              # -- Custom Actions --
              - choose:
                - conditions:
                    - "{{ temp_clear_include_custom_actions == 'enabled' }}"
                  sequence: !input temp_clear_custom_actions
              # -- Device Notification --
              - choose:
                - alias: "Temp Entwarnung - Geraete-Benachrichtigung"
                  conditions:
                    - "{{ temp_clear_include_device_notify == 'enabled' }}"
                    - "{{ temp_clear_notify_device | length > 0 }}"
                  sequence:
                    - repeat:
                        for_each: !input temp_clear_notify_device
                        sequence:
                          - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                            data:
                              title: "{{ temp_clear_notify_title }}"
                              message: "{{ temp_clear_notify_message }}"
                              data: "{{ temp_clear_device_message_data }}"
                            continue_on_error: true
              # -- UI Notification --
              - choose:
                - alias: "Temp Entwarnung - UI-Benachrichtigung"
                  conditions:
                    - "{{ temp_clear_include_ui_notify == 'enabled' }}"
                  sequence:
                    - action: persistent_notification.create
                      data:
                        title: "{{ temp_clear_ui_notify_title }}"
                        message: "{{ temp_clear_ui_notify_message }}"
                        notification_id: "{{ temp_clear_ui_notify_id if temp_clear_ui_notify_id != [] else '' }}"
              # -- Dashboard Notification --
              - choose:
                - alias: "Temp Entwarnung - Dashboard-Benachrichtigung"
                  conditions:
                    - "{{ temp_clear_include_dashboard_notify == 'enabled' }}"
                  sequence:
                    - action: input_text.set_value
                      target:
                        entity_id: !input temp_clear_dashboard_text_helper
                      data:
                        value: "{{ now().strftime('%d.%m.%Y %H:%M') }} - {{ temp_clear_notify_message[:220] }}"
              # -- Check if suppressed humidity alarm should now fire --
              - choose:
                - alias: "Unterdrueckter Feuchtigkeitsalarm nachholen"
                  conditions:
                    - condition: template
                      value_template: "{{ states(hum_alarm_boolean) == 'on' if hum_alarm_boolean else false }}"
                  sequence:
                    # Fire humidity alarm notifications now
                    - choose:
                      - conditions:
                          - "{{ hum_alarm_include_custom_actions == 'enabled' }}"
                        sequence: !input hum_alarm_custom_actions
                    - choose:
                      - alias: "Nachgeholter Hum Alarm - Geraete-Benachrichtigung"
                        conditions:
                          - "{{ hum_alarm_include_device_notify == 'enabled' }}"
                          - "{{ hum_alarm_notify_device | length > 0 }}"
                        sequence:
                          - repeat:
                              for_each: !input hum_alarm_notify_device
                              sequence:
                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                  data:
                                    title: "{{ hum_alarm_notify_title }}"
                                    message: "{{ hum_alarm_notify_message }}"
                                    data: "{{ hum_alarm_device_message_data }}"
                                  continue_on_error: true
                    - choose:
                      - alias: "Nachgeholter Hum Alarm - UI-Benachrichtigung"
                        conditions:
                          - "{{ hum_alarm_include_ui_notify == 'enabled' }}"
                        sequence:
                          - action: persistent_notification.create
                            data:
                              title: "{{ hum_alarm_ui_notify_title }}"
                              message: "{{ hum_alarm_ui_notify_message }}"
                              notification_id: "{{ hum_alarm_ui_notify_id if hum_alarm_ui_notify_id != [] else '' }}"
                    - choose:
                      - alias: "Nachgeholter Hum Alarm - Dashboard-Benachrichtigung"
                        conditions:
                          - "{{ hum_alarm_include_dashboard_notify == 'enabled' }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input hum_alarm_dashboard_text_helper
                            data:
                              value: "{{ now().strftime('%d.%m.%Y %H:%M') }} - {{ hum_alarm_notify_message[:220] }}"

    # ========================================================
    # HUMIDITY SENSOR CHANGE
    # ========================================================
    - alias: "Feuchtigkeitssensor hat sich geaendert"
      conditions:
        - condition: trigger
          id: 'hum_change'
      sequence:
        - choose:
          # -- FEUCHTIGKEITS-ALARM: Wert ausserhalb Normbereich --
          - alias: "Feuchtigkeit ausserhalb Normbereich - Alarm ausloesen"
            conditions:
              - condition: template
                value_template: >-
                  {{ (trigger_value | float > hum_max | float) or
                     (trigger_value | float < hum_min | float) }}
              - condition: template
                value_template: "{{ not is_hum_alarm_active }}"
            sequence:
              # Set alarm boolean
              - action: input_boolean.turn_on
                target:
                  entity_id: !input hum_alarm_boolean
              # Check priority: only notify if no temp alarm active
              - choose:
                - alias: "Kein Temperaturalarm aktiv - Feuchtigkeitsalarm senden"
                  conditions:
                    - condition: template
                      value_template: "{{ not is_temp_alarm_active }}"
                  sequence:
                    # -- Custom Actions --
                    - choose:
                      - conditions:
                          - "{{ hum_alarm_include_custom_actions == 'enabled' }}"
                        sequence: !input hum_alarm_custom_actions
                    # -- Device Notification --
                    - choose:
                      - alias: "Hum Alarm - Geraete-Benachrichtigung"
                        conditions:
                          - "{{ hum_alarm_include_device_notify == 'enabled' }}"
                          - "{{ hum_alarm_notify_device | length > 0 }}"
                        sequence:
                          - repeat:
                              for_each: !input hum_alarm_notify_device
                              sequence:
                                - choose:
                                  - alias: "Ohne Action Buttons"
                                    conditions:
                                      - "{{ hum_alarm_notify_action_buttons == 'disabled' }}"
                                    sequence:
                                      - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                        data:
                                          title: "{{ hum_alarm_notify_title }}"
                                          message: "{{ hum_alarm_notify_message }}"
                                          data: "{{ hum_alarm_device_message_data }}"
                                        continue_on_error: true
                                  - alias: "Mit Action Buttons"
                                    conditions:
                                      - "{{ hum_alarm_notify_action_buttons != 'disabled' }}"
                                    sequence:
                                      - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                        data:
                                          title: "{{ hum_alarm_notify_title }}"
                                          message: "{{ hum_alarm_notify_message }}"
                                          data: "{{ hum_alarm_device_message_data_action_button }}"
                                        continue_on_error: true
                    # -- UI Notification --
                    - choose:
                      - alias: "Hum Alarm - UI-Benachrichtigung"
                        conditions:
                          - "{{ hum_alarm_include_ui_notify == 'enabled' }}"
                        sequence:
                          - action: persistent_notification.create
                            data:
                              title: "{{ hum_alarm_ui_notify_title }}"
                              message: "{{ hum_alarm_ui_notify_message }}"
                              notification_id: "{{ hum_alarm_ui_notify_id if hum_alarm_ui_notify_id != [] else '' }}"
                    # -- Dashboard Notification --
                    - choose:
                      - alias: "Hum Alarm - Dashboard-Benachrichtigung"
                        conditions:
                          - "{{ hum_alarm_include_dashboard_notify == 'enabled' }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input hum_alarm_dashboard_text_helper
                            data:
                              value: "{{ now().strftime('%d.%m.%Y %H:%M') }} - {{ hum_alarm_notify_message[:220] }}"
                    # -- To-Do --
                    - choose:
                      - alias: "Hum Alarm - To-Do Eintrag"
                        conditions:
                          - "{{ hum_alarm_include_todo == 'enabled' }}"
                        sequence:
                          - action: todo.add_item
                            data:
                              item: "{{ hum_alarm_todo_title }}"
                              description: "{{ hum_alarm_notify_message }}"
                            target:
                              entity_id: !input hum_alarm_todo_list
                    # -- Action Button Wait --
                    - choose:
                      - alias: "Hum Alarm - Action Buttons warten"
                        conditions:
                          - "{{ hum_alarm_include_device_notify == 'enabled' }}"
                          - "{{ hum_alarm_notify_action_buttons != 'disabled' }}"
                          - "{{ hum_alarm_notify_device | length > 0 }}"
                        sequence:
                          - wait_for_trigger:
                              - trigger: event
                                event_type: mobile_app_notification_action
                                event_data:
                                  action: "{{ hum_alarm_action_button_todo }}"
                              - trigger: event
                                event_type: mobile_app_notification_action
                                event_data:
                                  action: "{{ hum_alarm_action_button_cancel }}"
                          - choose:
                            - alias: "Action Button gedrueckt"
                              conditions:
                                - "{{ wait.trigger is defined and wait.trigger.idx is defined }}"
                              sequence:
                                - choose:
                                  - conditions: "{{ wait.trigger.event.data.action == hum_alarm_action_button_todo }}"
                                    sequence:
                                      - action: todo.add_item
                                        data:
                                          item: "{{ hum_alarm_todo_title }}"
                                          description: "{{ hum_alarm_notify_message }}"
                                        target:
                                          entity_id: !input hum_alarm_todo_list
                                      - choose:
                                        - conditions:
                                            - "{{ hum_alarm_notify_action_buttons == 'enable_todo_button_confirmation' }}"
                                          sequence:
                                            - repeat:
                                                for_each: !input hum_alarm_notify_device
                                                sequence:
                                                  - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                    data:
                                                      title: "{{ hum_alarm_action_button_confirmation_title }}"
                                                      message: "{{ hum_alarm_action_button_confirmation_message }}"
                                                      data: "{{ hum_alarm_device_message_data }}"
                                                    continue_on_error: true
                                        - conditions:
                                            - "{{ hum_alarm_notify_action_buttons == 'enable_todo_button_clear' }}"
                                          sequence:
                                            - repeat:
                                                for_each: !input hum_alarm_notify_device
                                                sequence:
                                                  - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                    data:
                                                      message: clear_notification
                                                      data:
                                                        tag: "{{ hum_alarm_notify_tag }}"
                                                    continue_on_error: true
                                  - conditions: "{{ wait.trigger.event.data.action == hum_alarm_action_button_cancel }}"
                                    sequence:
                                      - choose:
                                        - conditions:
                                            - "{{ hum_alarm_notify_action_buttons == 'enable_todo_button_confirmation' }}"
                                          sequence:
                                            - repeat:
                                                for_each: !input hum_alarm_notify_device
                                                sequence:
                                                  - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                    data:
                                                      title: "{{ hum_alarm_action_button_confirmation_title }}"
                                                      message: "{{ hum_alarm_cancel_button_confirmation_message }}"
                                                      data: "{{ hum_alarm_device_message_data }}"
                                                    continue_on_error: true
                                        - conditions:
                                            - "{{ hum_alarm_notify_action_buttons == 'enable_todo_button_clear' }}"
                                          sequence:
                                            - repeat:
                                                for_each: !input hum_alarm_notify_device
                                                sequence:
                                                  - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                    data:
                                                      message: clear_notification
                                                      data:
                                                        tag: "{{ hum_alarm_notify_tag }}"
                                                    continue_on_error: true

          # -- FEUCHTIGKEITS-ENTWARNUNG: Alle Sensoren wieder im Bereich --
          - alias: "Feuchtigkeit wieder im Normbereich - Entwarnung"
            conditions:
              - condition: template
                value_template: >-
                  {{ (trigger_value | float <= hum_clear_max | float) and
                     (trigger_value | float >= hum_clear_min | float) }}
              - condition: template
                value_template: "{{ is_hum_alarm_active }}"
              - condition: template
                value_template: "{{ all_hum_in_range }}"
            sequence:
              # Clear alarm boolean
              - action: input_boolean.turn_off
                target:
                  entity_id: !input hum_alarm_boolean
              # Only send clear notifications if no temp alarm is active
              - choose:
                - alias: "Kein Temperaturalarm aktiv - Entwarnung senden"
                  conditions:
                    - condition: template
                      value_template: "{{ not is_temp_alarm_active }}"
                  sequence:
                    # -- Custom Actions --
                    - choose:
                      - conditions:
                          - "{{ hum_clear_include_custom_actions == 'enabled' }}"
                        sequence: !input hum_clear_custom_actions
                    # -- Device Notification --
                    - choose:
                      - alias: "Hum Entwarnung - Geraete-Benachrichtigung"
                        conditions:
                          - "{{ hum_clear_include_device_notify == 'enabled' }}"
                          - "{{ hum_clear_notify_device | length > 0 }}"
                        sequence:
                          - repeat:
                              for_each: !input hum_clear_notify_device
                              sequence:
                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                  data:
                                    title: "{{ hum_clear_notify_title }}"
                                    message: "{{ hum_clear_notify_message }}"
                                    data: "{{ hum_clear_device_message_data }}"
                                  continue_on_error: true
                    # -- UI Notification --
                    - choose:
                      - alias: "Hum Entwarnung - UI-Benachrichtigung"
                        conditions:
                          - "{{ hum_clear_include_ui_notify == 'enabled' }}"
                        sequence:
                          - action: persistent_notification.create
                            data:
                              title: "{{ hum_clear_ui_notify_title }}"
                              message: "{{ hum_clear_ui_notify_message }}"
                              notification_id: "{{ hum_clear_ui_notify_id if hum_clear_ui_notify_id != [] else '' }}"
                    # -- Dashboard Notification --
                    - choose:
                      - alias: "Hum Entwarnung - Dashboard-Benachrichtigung"
                        conditions:
                          - "{{ hum_clear_include_dashboard_notify == 'enabled' }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input hum_clear_dashboard_text_helper
                            data:
                              value: "{{ now().strftime('%d.%m.%Y %H:%M') }} - {{ hum_clear_notify_message[:220] }}"
