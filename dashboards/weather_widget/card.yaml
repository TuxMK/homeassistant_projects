# Wetter-Widget für Übersichts-Dashboard
# Zeigt die aktuelle Wetterlage (Zustand, Temperatur, Wind) an.
#
# Voraussetzungen:
# - Wetter-Entity "weather.forecast_wetter" (Name ggf. anpassen)
# - Mushroom Cards (via HACS installieren)

type: custom:mushroom-template-card
primary: |
  {% set c = states('weather.forecast_wetter') %}
  {% set map = {
    'sunny': 'Sonnig',
    'clear-night': 'Klar',
    'partlycloudy': 'Teils bewölkt',
    'cloudy': 'Bewölkt',
    'rainy': 'Regnerisch',
    'pouring': 'Starkregen',
    'snowy': 'Schnee',
    'snowy-rainy': 'Schneeregen',
    'fog': 'Nebel',
    'hail': 'Hagel',
    'lightning': 'Gewitter',
    'lightning-rainy': 'Gewitter & Regen',
    'windy': 'Windig',
    'windy-variant': 'Windig',
    'exceptional': 'Außergewöhnlich'
  } %}
  {{ map.get(c, c | title) }}
secondary: >
  {{ state_attr('weather.forecast_wetter', 'temperature') | round(0) }} °C · {{
  state_attr('weather.forecast_wetter', 'wind_speed') | round(0) }} km/h
icon: |
  {% set c = states('weather.forecast_wetter') %}
  {% if c == 'sunny' %}mdi:weather-sunny
  {% elif c == 'clear-night' %}mdi:weather-night
  {% elif c == 'partlycloudy' %}mdi:weather-partly-cloudy
  {% elif c == 'cloudy' %}mdi:weather-cloudy
  {% elif c == 'rainy' %}mdi:weather-rainy
  {% elif c == 'pouring' %}mdi:weather-pouring
  {% elif c in ['snowy','snowy-rainy'] %}mdi:weather-snowy
  {% elif c == 'fog' %}mdi:weather-fog
  {% elif c == 'hail' %}mdi:weather-hail
  {% elif c in ['lightning','lightning-rainy'] %}mdi:weather-lightning
  {% elif c in ['windy','windy-variant'] %}mdi:weather-windy
  {% else %}mdi:weather-cloudy{% endif %}
icon_color: |
  {% set c = states('weather.forecast_wetter') %}
  {% if c == 'sunny' %}orange
  {% elif c == 'clear-night' %}indigo
  {% elif c in ['rainy','pouring'] %}blue
  {% elif c in ['lightning','lightning-rainy'] %}amber
  {% elif c in ['snowy','snowy-rainy','hail'] %}light-blue
  {% else %}blue-grey{% endif %}
tap_action:
  action: more-info
  entity: weather.forecast_wetter
grid_options:
  columns: 6
  rows: 2
